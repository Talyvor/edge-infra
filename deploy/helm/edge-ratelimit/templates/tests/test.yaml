# `helm test <release>`: the rate-limit service answers a gRPC call on its
# Service, the way Envoy calls it — a ShouldRateLimit with an empty request over
# mutual TLS — and refuses the same call in plaintext.
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "edge-ratelimit.fullname" . }}-test
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "edge-ratelimit.testLabels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    # Kept after a run, so `helm test --logs` can read it; the next run replaces it.
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  securityContext:
    runAsNonRoot: true
    runAsUser: 100   # the curl image's curl_user:curl_group
    runAsGroup: 101
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: test
      image: {{ include "edge-ratelimit.image" (dict "image" .Values.tests.image "global" .Values.global) | quote }}
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { cpu: 200m, memory: 128Mi }
      imagePullPolicy: {{ .Values.tests.image.pullPolicy }}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: tls
          mountPath: /tls
          readOnly: true
        - name: tmp   # the root filesystem is read-only; the gRPC frame is written here
          mountPath: /tmp
      command: ["sh", "-c"]
      args:
        - |
          set -eu
          path="{{ include "edge-ratelimit.fullname" . }}:{{ .Values.service.grpcPort }}/envoy.service.ratelimit.v3.RateLimitService/ShouldRateLimit"
          # One gRPC frame holding an empty message: flag 0, length 0. From a file,
          # not stdin, so a retry can send it again.
          printf '\0\0\0\0\0' > /tmp/frame
          grpc() { curl -sS -D - -o /dev/null --max-time 10 \
            -H 'content-type: application/grpc' -H 'te: trailers' --data-binary @/tmp/frame "$@"; }
          hdrs="$(grpc --http2 --retry 10 --retry-delay 3 --retry-all-errors \
            --cacert /tls/ca.crt --cert /tls/tls.crt --key /tls/tls.key "https://$path")"
          echo "$hdrs"
          printf '%s' "$hdrs" | grep -qi '^grpc-status:' || { echo "FAIL: no gRPC answer from https://$path"; exit 1; }
          echo "PASS: the rate-limit service answers gRPC over mutual TLS on its Service"
          if grpc --http2-prior-knowledge "http://$path" 2>&1 | grep -qi '^grpc-status:'; then
            echo "FAIL: the rate-limit service answered a plaintext call"; exit 1
          fi
          echo "PASS: the rate-limit service refuses a plaintext call"
  volumes:
    - name: tmp
      emptyDir: {}
    - name: tls
      secret:
        secretName: {{ .Values.tls.existingSecret }}
