{{- if .Values.prometheus.enabled }}
{{- $labels := include "edge-observability.labels" (dict "ctx" $ "component" "prometheus") }}
{{- $config := include "edge-observability.prometheusConfig" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: {{ .Release.Namespace }}
  labels:
    {{- $labels | nindent 4 }}
---
# Pod discovery: read-only, pods only.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-{{ .Release.Name }}-prometheus
  labels:
    {{- $labels | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-{{ .Release.Name }}-prometheus
  labels:
    {{- $labels | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Namespace }}-{{ .Release.Name }}-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- $labels | nindent 4 }}
data:
  prometheus.yaml: |
    {{- $config | nindent 4 }}
---
# The alert and recording rules in this chart's rules/ directory.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: {{ .Release.Namespace }}
  labels:
    {{- $labels | nindent 4 }}
data:
  {{- (.Files.Glob "rules/*.yaml").AsConfig | nindent 2 }}
---
{{- with (include "edge-observability.pvc" (dict "ctx" $ "component" "prometheus" "persistence" .Values.prometheus.persistence)) }}
{{ . }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: {{ .Release.Namespace }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "edge-observability.selectorLabels" (dict "ctx" $ "component" "prometheus") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- $labels | nindent 8 }}
      annotations:
        checksum/config: {{ $config | sha256sum }}
        checksum/rules: {{ (.Files.Glob "rules/*.yaml").AsConfig | sha256sum }}
        edge.talyvor.com/security-exception: "automountServiceAccountToken not false: kubernetes_sd_configs discovers scrape targets through the API, read-only under the ClusterRole above"
    spec:
      serviceAccountName: prometheus
      securityContext:
        {{- include "edge-observability.podSecurityContext" 65534 | nindent 8 }}
      automountServiceAccountToken: true
      containers:
        - name: prometheus
          image: {{ include "edge-observability.image" (dict "image" .Values.prometheus.image "global" .Values.global) | quote }}
          args:
            - --config.file=/etc/prometheus/prometheus.yaml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time={{ .Values.prometheus.retention }}
            # The collector sends OTLP metrics here (remote write).
            - --web.enable-remote-write-receiver
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 8
          securityContext:
            {{- include "edge-observability.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.prometheus.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yaml
              subPath: prometheus.yaml
            - name: rules
              mountPath: /etc/prometheus/rules
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: rules
          configMap:
            name: prometheus-rules
        {{- include "edge-observability.dataVolume" (dict "name" "prometheus-data" "persistence" .Values.prometheus.persistence) | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: {{ .Release.Namespace }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "edge-observability.selectorLabels" (dict "ctx" $ "component" "prometheus") | nindent 4 }}
  ports:
    - name: http
      port: 9090
      targetPort: http
{{- end }}

{{- define "edge-observability.prometheusConfig" -}}
global:
  scrape_interval: {{ .Values.prometheus.scrapeInterval }}
  evaluation_interval: {{ .Values.prometheus.evaluationInterval }}
  {{- if or .Values.cluster .Values.environment }}
  external_labels:
    {{- with .Values.cluster }}
    cluster: {{ . | quote }}
    {{- end }}
    {{- with .Values.environment }}
    environment: {{ . | quote }}
    {{- end }}
  {{- end }}

rule_files:
  - /etc/prometheus/rules/*.yaml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  {{- if .Values.otelCollector.enabled }}

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector.{{ .Release.Namespace }}.svc.cluster.local:8888"]
  {{- end }}

  # Every pod annotated prometheus.io/scrape: "true", on prometheus.io/port at
  # prometheus.io/path. edge-proxy runs hostNetwork, so its pod IP is the node's
  # and the stats listener (:9903) is scraped there.
  - job_name: kubernetes-pods
    kubernetes_sd_configs:
      - role: pod
        {{- with .Values.prometheus.namespaces }}
        namespaces:
          names:
            {{- toYaml . | nindent 12 }}
        {{- end }}
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        regex: "true"
        action: keep
      - source_labels: [__meta_kubernetes_pod_phase]
        regex: Pending|Succeeded|Failed|Completed
        action: drop
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        regex: (.+)
        target_label: __metrics_path__
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_node_name]
        target_label: node
      - source_labels: [__meta_kubernetes_pod_label_app]
        target_label: app
  {{- with .Values.prometheus.extraScrapeConfigs }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end -}}
