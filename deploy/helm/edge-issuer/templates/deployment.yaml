apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "edge-issuer.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "edge-issuer.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "edge-issuer.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "edge-issuer.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "edge-issuer.serviceAccountName" . }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        # Numeric UID/GID is REQUIRED: the distroless image's user is the NAME
        # "nonroot", which the kubelet cannot verify as non-root at admission —
        # runAsNonRoot alone then yields CreateContainerConfigError and the pod
        # never starts. 65532 is the distroless nonroot uid:gid.
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      containers:
        - name: issuer
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          image: {{ include "edge-issuer.image" (dict "image" .Values.image "global" .Values.global) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve"]
          ports:
            - name: https
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: ISSUER_LISTEN_ADDR
              value: "0.0.0.0:{{ .Values.service.port }}"
            - name: ISSUER_KEYS_DIR
              value: {{ .Values.signingKeys.mountPath }}
            - name: ISSUER_ACTIVE_KID
              value: {{ required "config.activeKid is required" .Values.config.activeKid | quote }}
            - name: ISSUER_TOKEN_TTL
              value: {{ .Values.config.tokenTTL | quote }}
            - name: ISSUER_TLS_CERT
              value: {{ .Values.tls.mountPath }}/tls.crt
            - name: ISSUER_TLS_KEY
              value: {{ .Values.tls.mountPath }}/tls.key
            - name: ISSUER_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.existingSecret }}
                  key: ISSUER_URL
            - name: ISSUER_AUDIENCE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.existingSecret }}
                  key: ISSUER_AUDIENCE
            - name: ISSUER_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.existingSecret }}
                  key: ISSUER_DATABASE_URL
            # SCIM provisioning and OIDC sign-in: each is switched on by its keys
            # in config.existingSecret; an absent key leaves the feature off.
            {{- range $k := list "ISSUER_SCIM_TOKEN" "ISSUER_OIDC_ISSUER" "ISSUER_OIDC_CLIENT_ID" "ISSUER_OIDC_CLIENT_SECRET" "ISSUER_OIDC_REDIRECT_URL" }}
            - name: {{ $k }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.config.existingSecret }}
                  key: {{ $k }}
                  optional: true
            {{- end }}
            {{- with .Values.sso.caFile }}
            - name: ISSUER_OIDC_CA_FILE
              value: {{ . | quote }}
            {{- end }}
          volumeMounts:
            - name: signing-keys
              mountPath: {{ .Values.signingKeys.mountPath }}
              readOnly: true
            - name: issuer-tls
              mountPath: {{ .Values.tls.mountPath }}
              readOnly: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: signing-keys
          secret:
            secretName: {{ .Values.signingKeys.existingSecret }}
        - name: issuer-tls
          secret:
            secretName: {{ .Values.tls.existingSecret }}
