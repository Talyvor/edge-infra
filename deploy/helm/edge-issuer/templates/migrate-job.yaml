apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "edge-issuer.fullname" . }}-migrate
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "edge-issuer.labels" . | nindent 4 }}
  annotations:
    # Run the embedded DB migrations before the Deployment rolls out, on every
    # install and upgrade. Migrations are idempotent (CREATE ... IF NOT EXISTS).
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      # Not the Deployment's selector labels: a migrate pod serves nothing, so the
      # Service and the PodDisruptionBudget must not select it.
      labels:
        app.kubernetes.io/name: {{ include "edge-issuer.name" . }}-migrate
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ include "edge-issuer.serviceAccountName" . }}
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532   # the distroless nonroot uid:gid, as the Deployment
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      containers:
        - name: migrate
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          image: {{ include "edge-issuer.image" (dict "image" .Values.image "global" .Values.global) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["migrate"]
          env:
            - name: ISSUER_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.existingSecret }}
                  key: ISSUER_DATABASE_URL
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
