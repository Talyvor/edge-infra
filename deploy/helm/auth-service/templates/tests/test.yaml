# `helm test <release>`: auth-service answers its health check on its Service.
# (Its ext_authz gRPC port is mutual TLS, for the gateway's client cert only.)
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "auth-service.fullname" . }}-test
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "auth-service.testLabels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    # Kept after a run, so `helm test --logs` can read it; the next run replaces it.
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  securityContext:
    runAsNonRoot: true
    runAsUser: 100   # the curl image's curl_user:curl_group
    runAsGroup: 101
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: test
      image: {{ include "auth-service.image" (dict "image" .Values.tests.image "global" .Values.global) | quote }}
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { cpu: 200m, memory: 128Mi }
      imagePullPolicy: {{ .Values.tests.image.pullPolicy }}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      command: ["sh", "-c"]
      args:
        - |
          set -eu
          url="http://{{ include "auth-service.fullname" . }}:{{ .Values.service.metricsPort }}/healthz"
          code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 --retry 10 --retry-delay 3 --retry-all-errors "$url")"
          echo "GET $url -> $code"
          [ "$code" = 200 ] || { echo "FAIL: auth-service is not healthy"; exit 1; }
          echo "PASS: auth-service answers on its Service"
