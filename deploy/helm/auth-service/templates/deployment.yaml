apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "auth-service.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "auth-service.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "auth-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "auth-service.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "auth-service.serviceAccountName" . }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.confidential }}
      {{- if .enabled }}
      {{- if not .nodeSelector }}
      {{- fail "confidential.enabled needs confidential.nodeSelector: the labels only your confidential nodes carry" }}
      {{- end }}
      {{- if not .attestation.measurements }}
      {{- fail "confidential.enabled needs confidential.attestation.measurements: the launch measurements allowed to start" }}
      {{- end }}
      {{- if .runtimeClassName }}
      runtimeClassName: {{ .runtimeClassName }}
      {{- end }}
      nodeSelector:
        {{- toYaml .nodeSelector | nindent 8 }}
      {{- with .tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        # Numeric UID/GID is REQUIRED: the distroless image's user is the NAME
        # "nonroot", which the kubelet cannot verify as non-root at admission —
        # runAsNonRoot alone then yields CreateContainerConfigError and the pod
        # never starts. 65532 is the distroless nonroot uid:gid.
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.confidential }}
      {{- if .enabled }}
      initContainers:
        # Refuses to let auth-service start unless a fresh attestation report
        # verifies; the reason lands in this container's termination message.
        - name: attest
          image: {{ include "auth-service.image" (dict "image" .attestation.image "global" $.Values.global) | quote }}
          imagePullPolicy: {{ .attestation.image.pullPolicy }}
          args: ["gate"]
          env:
            - name: ATTEST_EVIDENCE_URL
              value: {{ required "confidential.attestation.evidenceURL is required" .attestation.evidenceURL | quote }}
            - name: ATTEST_TRUSTED_KEY
              value: {{ required "confidential.attestation.trustedKey is required: the attester's base64 ed25519 public key" .attestation.trustedKey | quote }}
            - name: ATTEST_MEASUREMENTS
              value: {{ join "," .attestation.measurements | quote }}
            - name: ATTEST_MAX_AGE
              value: {{ .attestation.maxAge | quote }}
            - name: ATTEST_TIMEOUT
              value: {{ .attestation.timeout | quote }}
          terminationMessagePolicy: FallbackToLogsOnError
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      {{- end }}
      {{- end }}
      automountServiceAccountToken: false
      containers:
        - name: auth-service
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          image: {{ include "auth-service.image" (dict "image" .Values.image "global" .Values.global) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: grpc
              containerPort: {{ .Values.service.grpcPort }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.service.metricsPort }}
              protocol: TCP
          env:
            - name: GRPC_ADDR
              value: "0.0.0.0:{{ .Values.service.grpcPort }}"
            - name: METRICS_ADDR
              value: "0.0.0.0:{{ .Values.service.metricsPort }}"
            - name: JWKS_REFRESH_S
              value: {{ .Values.config.jwksRefreshSeconds | quote }}
            - name: JWKS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.existingSecret }}
                  key: JWKS_URL
            - name: JWT_AUDIENCE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.existingSecret }}
                  key: JWT_AUDIENCE
            - name: JWT_ISSUER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.existingSecret }}
                  key: JWT_ISSUER
            # More identity providers (Okta, the cluster's ServiceAccounts, ...).
            # Optional: absent from the Secret means JWT_ISSUER is the only one.
            - name: JWT_ISSUERS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.existingSecret }}
                  key: JWT_ISSUERS
                  optional: true
            - name: TRANSIT_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.existingSecret }}
                  key: TRANSIT_SIGNING_KEY
            {{- with .Values.tls }}
            - name: AUTH_TLS_CERT
              value: {{ .mountPath }}/tls.crt
            - name: AUTH_TLS_KEY
              value: {{ .mountPath }}/tls.key
            - name: AUTH_TLS_CA
              value: {{ .mountPath }}/ca.crt
            # Trust the same internal CA for the https JWKS fetch, so the
            # auth-service can reach the token issuer's JWKS endpoint.
            - name: JWKS_CA_FILE
              value: {{ .mountPath }}/ca.crt
            {{- end }}
          volumeMounts:
            # The cluster's CA, where a ServiceAccount mount would put it, for a
            # JWT_ISSUERS entry trusting the cluster's own ServiceAccount issuer
            # (ca_file). The token itself is not mounted: auth-service never
            # calls the API.
            - name: kube-root-ca
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            {{- with .Values.tls }}
            - name: auth-tls
              mountPath: {{ .mountPath }}
              readOnly: true
            {{- end }}
            {{- if .Values.jwksFiles.existingSecret }}
            - name: jwks-files
              mountPath: {{ .Values.jwksFiles.mountPath }}
              readOnly: true
            {{- end }}
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: kube-root-ca
          configMap:
            name: kube-root-ca.crt
        {{- if .Values.jwksFiles.existingSecret }}
        - name: jwks-files
          secret:
            secretName: {{ .Values.jwksFiles.existingSecret }}
        {{- end }}
        {{- with .Values.tls }}
        - name: auth-tls
          secret:
            secretName: {{ .existingSecret }}
        {{- end }}
