replicaCount: 2

image:
  repository: ghcr.io/talyvor/auth-service
  tag: "447ceb18980fc02fdc7e28db16354c62e3018850"  # pin to the SHA you pushed
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  grpcPort: 50051
  metricsPort: 9090

config:
  existingSecret: auth-service-secrets
  # How often each issuer's signing keys are re-read (JWKS_REFRESH_S).
  jwksRefreshSeconds: 300

# Signing keys held in the cluster, for an identity provider the gateway cannot
# reach at run time (an air-gapped cluster trusting your own IdP). Put each
# provider's JWKS document in this Secret, one key per provider, e.g.
#   kubectl -n infra create secret generic idp-jwks --from-file=corp.json=<(curl -s https://idp.corp.example/keys)
# and point its JWT_ISSUERS entry at the file instead of a URL:
#   {"issuer":"https://idp.corp.example","jwks_file":"/etc/auth-service/jwks/corp.json"}
# The keys are re-read every jwksRefreshSeconds, so updating the Secret rotates
# them with no restart and no network call. "" = no Secret mounted.
jwksFiles:
  existingSecret: ""
  mountPath: /etc/auth-service/jwks

tls:
  existingSecret: auth-service-tls-secret  # issued by this chart (certificate.*)
  mountPath: /etc/auth-tls

# The certificate in tls.existingSecret, issued by cert-manager when the chart is
# installed, so no certificate is applied by hand. The issuer is the edge-pki
# chart's internal CA unless issuerRef names your own. create: false to bring the
# Secret yourself. dnsNames: [] = the names of this chart's Service.
certificate:
  create: true
  issuerRef:
    name: edge-internal-ca
    kind: ClusterIssuer
  dnsNames: []
  duration: 2160h   # 90 days
  renewBefore: 360h # 15 days

# Pull secret(s) for private images, wired onto the ServiceAccount so pods (and
# hook Jobs) can pull without a manual `kubectl patch sa`. e.g. [{name: ghcr}].
imagePullSecrets: []

serviceAccount:
  create: true
  name: ""

resources:
  requests:
    cpu: 200m
    memory: 64Mi
  limits:
    cpu: 1000m
    memory: 256Mi

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9090"

# Spread the copies across nodes and zones: Kubernetes topologySpreadConstraints,
# as written, each with a labelSelector on app: auth-service. Empty = the
# scheduler decides; deploy/profiles/ha sets it.
topologySpreadConstraints: []

# PodDisruptionBudget: a voluntary disruption (a node drain, a cluster upgrade)
# evicts at most maxUnavailable of these pods at once. Set minAvailable to keep a
# floor instead; when it is set it is used in place of maxUnavailable.
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

# HorizontalPodAutoscaler (autoscaling/v2) on CPU, off by default. While it is on
# it owns the replica count (replicaCount is not rendered), and it needs the
# cluster's metrics API (metrics-server). There is no default ceiling: set
# maxReplicas when you switch it on.
#   minReplicas                     default: replicaCount
#   targetCPUUtilizationPercentage  default: Kubernetes' own (80)
autoscaling:
  enabled: false

# The image `helm test <release>` runs (templates/tests/): curl, checking that the
# release answers through its Service. global.imageRegistry applies to it too, so
# mirror it with the others for an air-gapped install.
tests:
  image:
    repository: curlimages/curl
    tag: "8.11.1@sha256:c1fe1679c34d9784c1b0d1e5f62ac0a79fca01fb6377cdd33e90473c6f9f9a69"  # pinned digest
    pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

# NetworkPolicy (B27.33): default-deny ingress to this chart's pods, allowing
# only the flows in templates/networkpolicy.yaml. Enforced by Calico (or any
# CNI that enforces NetworkPolicy). OFF in the base values, like extAuthz:
# ArgoCD syncs base values, and switching it on without the right gatewayCIDRs
# cuts the gateway off. Switch it on per install, with that cluster's CIDRs.
networkPolicy:
  enabled: false
  # CIDR(s) of the nodes running edge-proxy. Envoy runs hostNetwork, so its
  # traffic carries the NODE IP, which no pod or namespace selector matches.
  # Required when enabled — the chart refuses to render without it.
  gatewayCIDRs: []
  # Pods in this namespace count as the gateway too.
  gatewayNamespace: edge
  # More ingress rules, appended as written, e.g. Prometheus on the metrics port:
  #   - from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}}]
  #     ports: [{port: metrics}]
  extraIngress: []

# Confidential compute (B27.34). OFF by default. ON, the pods run only on
# confidential nodes — the nodeSelector (and tolerations) below, plus
# runtimeClassName when your confidential runtime needs one (e.g. kata-qemu-snp or
# kata-qemu-tdx for Confidential Containers; empty for node pools that are
# confidential VMs end to end). And an `attest` init container must verify a
# fresh attestation report before auth-service starts: no report, or one that
# does not verify, and the pod never starts.
# The gate verifies "mock" reports only — the kind e2e's stand-in TEE (Phase 19).
# Real AMD SEV-SNP / Intel TDX reports need confidential VMs to produce and the
# vendor's certificate chain to verify; the gate refuses them as unverifiable.
confidential:
  enabled: false
  runtimeClassName: ""
  # Labels only your confidential nodes carry. Required when enabled.
  nodeSelector:
    talyvor.io/confidential: "true"
  tolerations: []
  attestation:
    image:
      repository: ghcr.io/talyvor/edge-attest
      tag: "ad3eed7c31f72c3f7892cf9ce1270bacd7a9f13e"  # pin to the SHA you pushed
      pullPolicy: IfNotPresent
    # The attester's evidence endpoint; the gate adds ?runtime_data=<nonce>. The
    # default is the Confidential Containers attestation agent inside the guest.
    evidenceURL: http://127.0.0.1:8006/aa/evidence
    # The attester's ed25519 public key, base64. Required when enabled.
    trustedKey: ""
    # Launch measurements (hex) allowed to start. Required when enabled.
    measurements: []
    # Oldest report accepted, and how long to wait for the attester to answer.
    maxAge: 5m
    timeout: 30s

global:
  # Pull every image this chart runs from this registry instead of the one each
  # image names: a mirror, or the local registry of an air-gapped install (e.g.
  # registry.internal:5000). The path is kept, so mirror the images under it:
  # ghcr.io/talyvor/edge-osb -> <registry>/talyvor/edge-osb,
  # envoyproxy/envoy -> <registry>/envoyproxy/envoy,
  # redis -> <registry>/library/redis.  "" = each image's own registry.
  imageRegistry: ""
