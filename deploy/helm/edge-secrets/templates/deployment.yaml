apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "edge-secrets.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "edge-secrets.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "edge-secrets.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "edge-secrets.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "edge-secrets.serviceAccountName" . }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        # Numeric UID/GID is REQUIRED: the distroless image's user is the NAME
        # "nonroot", which the kubelet cannot verify as non-root at admission —
        # runAsNonRoot alone then yields CreateContainerConfigError and the pod
        # never starts. 65532 is the distroless nonroot uid:gid.
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      containers:
        - name: secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          image: {{ include "edge-secrets.image" (dict "image" .Values.image "global" .Values.global) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve"]
          ports:
            - name: mtls
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: SECRETS_LISTEN_ADDR
              value: "0.0.0.0:{{ .Values.service.port }}"
            - name: SECRETS_TLS_CERT
              value: {{ .Values.tls.mountPath }}/tls.crt
            - name: SECRETS_TLS_KEY
              value: {{ .Values.tls.mountPath }}/tls.key
            # Operator client CA — the SEPARATE edge-admin-ca (never the data plane).
            - name: SECRETS_ADMIN_CA
              value: {{ .Values.adminCA.mountPath }}/{{ .Values.adminCA.key }}
            - name: SECRETS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.existingSecret }}
                  key: SECRETS_DATABASE_URL
            # Optional admin-key fallback; when absent the component is mTLS-only.
            - name: SECRETS_ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.existingSecret }}
                  key: SECRETS_ADMIN_API_KEY
            # Encryption-at-rest KEK (32-byte base64 AES-256). REQUIRED — the
            # custodian refuses to start without it. Must equal the control-plane's
            # SECRET_KEK so it can decrypt on load.
            - name: SECRET_KEK
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.existingSecret }}
                  key: SECRET_KEK
                  optional: true
            # Mid-rotation only: the old KEK(s), comma-separated, which open but
            # never seal; `secrets reseal` moves every key off them (docs/kek-rotation.md).
            - name: SECRET_KEK_PREVIOUS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.existingSecret }}
                  key: SECRET_KEK_PREVIOUS
                  optional: true
          volumeMounts:
            - name: tls
              mountPath: {{ .Values.tls.mountPath }}
              readOnly: true
            - name: admin-ca
              mountPath: {{ .Values.adminCA.mountPath }}
              readOnly: true
          # TCP probes: the mTLS listener rejects certless HTTPS handshakes, so a
          # plaintext httpGet probe can't complete — tcpSocket checks liveness
          # without a client cert. (A dedicated plaintext health port is a noted
          # follow-on.)
          readinessProbe:
            tcpSocket:
              port: mtls
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: mtls
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: tls
          secret:
            secretName: {{ .Values.tls.existingSecret }}
        - name: admin-ca
          secret:
            secretName: {{ .Values.adminCA.existingSecret }}
