# `helm test <release>`: the custodian is up on its Service AND refuses a client
# that holds neither an operator certificate nor the admin key. It runs one of two
# ways (internal/secrets/tls.go): mTLS only, where such a client is refused at the
# TLS handshake; or with the admin-key fallback, where the handshake completes and
# a key read answers 401. Either refusal passes; a dead or open custodian fails.
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "edge-secrets.fullname" . }}-test
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "edge-secrets.testLabels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    # Kept after a run, so `helm test --logs` can read it; the next run replaces it.
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  securityContext:
    runAsNonRoot: true
    runAsUser: 100   # the curl image's curl_user:curl_group
    runAsGroup: 101
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: test
      image: {{ include "edge-secrets.image" (dict "image" .Values.tests.image "global" .Values.global) | quote }}
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { cpu: 200m, memory: 128Mi }
      imagePullPolicy: {{ .Values.tests.image.pullPolicy }}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      command: ["sh", "-c"]
      args:
        - |
          set -eu
          url="https://{{ include "edge-secrets.fullname" . }}:{{ .Values.service.port }}/v1/secrets/helm-test"
          out=""; i=0
          while [ "$i" -lt 10 ]; do
            out="$(curl -sSk --max-time 10 -o /dev/null -w '%{http_code}' "$url" 2>&1 || true)"
            case "$out" in *"certificate required"* | 401) break ;; esac
            i=$((i + 1)); sleep 3
          done
          echo "GET $url with no certificate and no admin key -> $out"
          case "$out" in
            *"certificate required"*) echo "PASS: the custodian answers on its Service and refuses a client without an operator certificate at the handshake" ;;
            401) echo "PASS: the custodian answers on its Service and refuses a key read without a certificate or the admin key" ;;
            *) echo "FAIL: expected the TLS alert 'certificate required' or a 401"; exit 1 ;;
          esac
