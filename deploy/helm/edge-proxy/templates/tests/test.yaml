{{- if .Values.hostNetwork }}
# `helm test <release>`: the Envoy on the node this pod lands on is serving and
# connected to its control plane — on the node's own address, where the gateway
# listens. Its readiness listener (:9902) answers 200, and its stats (:9903,
# proxied from the localhost-only admin) show the server LIVE and the xDS stream
# up. The readiness listener alone would not do: it is static, and answers
# before Envoy has any configuration.
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "edge-proxy.fullname" . }}-test
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "edge-proxy.testLabels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    # Kept after a run, so `helm test --logs` can read it; the next run replaces it.
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  securityContext:
    runAsNonRoot: true
    runAsUser: 100   # the curl image's curl_user:curl_group
    runAsGroup: 101
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: test
      image: {{ include "edge-proxy.image" (dict "image" .Values.tests.image "global" .Values.global) | quote }}
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { cpu: 200m, memory: 128Mi }
      imagePullPolicy: {{ .Values.tests.image.pullPolicy }}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      env:
        - name: HOST_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
      command: ["sh", "-c"]
      args:
        - |
          set -eu
          ready="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 --retry 10 --retry-delay 3 --retry-all-errors "http://$HOST_IP:9902/ready")"
          echo "GET http://$HOST_IP:9902/ready -> $ready"
          stats="$(curl -fsS --max-time 10 --retry 10 --retry-delay 3 --retry-all-errors "http://$HOST_IP:9903/stats/prometheus")"
          state="$(printf '%s\n' "$stats" | awk '$1 == "envoy_server_state{}" { print $2 }')"
          xds="$(printf '%s\n' "$stats" | awk '$1 == "envoy_control_plane_connected_state{}" { print $2 }')"
          echo "envoy_server_state = ${state:-absent} (0 is LIVE), envoy_control_plane_connected_state = ${xds:-absent}"
          [ "$ready" = 200 ] && [ "$state" = 0 ] && [ "$xds" = 1 ] \
            || { echo "FAIL: the node's Envoy is not serving, not LIVE, or not connected to its control plane"; exit 1; }
          echo "PASS: the node's Envoy is LIVE and connected to its control plane"
{{- end }}
