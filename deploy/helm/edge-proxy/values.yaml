image:
  repository: envoyproxy/envoy
  tag: v1.39.2@sha256:460f8c329f24b2e1c7c5af64cb314a6f351ad1c262ba77b135ac46b35ebd5f85  # pinned digest
  pullPolicy: IfNotPresent

# The init container that writes this node's id into the Envoy bootstrap.
bootstrapImage:
  repository: busybox
  tag: "1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662"  # pinned digest

hostNetwork: true

updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: "10%"

xds:
  controlPlaneHost: edge-control-plane.infra.svc.cluster.local
  controlPlanePort: 18000
  tls:
    # mTLS to the control-plane xDS server, which requires client certs
    # unconditionally. Gates BOTH the bootstrap transport_socket and the client
    # cert mount together (no plaintext half-state). Keep true fleet-wide.
    enabled: true
    existingSecret: envoy-xds-client-tls-secret
    mountPath: /etc/xds-client-tls

tls:
  existingSecret: envoy-serving-tls-secret

# ext_authz upstream client cert (edge-proxy → auth-service mTLS). The auth-service
# requires client-cert verification, so Envoy must present this cert on the
# ext_authz gRPC leg. This only MOUNTS the secret on the Envoy pod; the control
# plane renders the ext_authz cluster and points at these files via its own
# extAuthz.caFile/certFile/keyFile — whose directory MUST equal mountPath here.
# While this is enabled the chart issues the secret (certificate.*); enable it +
# the control-plane extAuthz together. The volume is required (not optional): if
# the secret is absent the pod won't start — a loud, correct failure vs. silent
# plaintext. Keep in lockstep with edge-control-plane extAuthz.enabled.
extAuthz:
  clientTLS:
    enabled: true
    existingSecret: envoy-authz-client-tls-secret
    mountPath: /etc/authz-client-tls

# The certificates in the three Secrets above, issued by cert-manager when the
# chart is installed, so no certificate is applied by hand: Envoy's xDS client
# certificate (while xds.tls.enabled), its ext_authz client certificate (while
# extAuthz.clientTLS.enabled) and its serving certificate (tls.existingSecret,
# for serving.dnsNames). The issuer is the edge-pki chart's internal CA unless
# issuerRef names your own; it must be the CA the control plane and the
# auth-service trust. create: false to bring the Secrets yourself. edge-egress,
# installed in this namespace, mounts the same two client Secrets.
certificate:
  create: true
  issuerRef:
    name: edge-internal-ca
    kind: ClusterIssuer
  duration: 2160h   # the two client certificates: 90 days
  renewBefore: 360h # 15 days
  serving:
    dnsNames: ["*.edge.io"]   # [] = no serving certificate
    duration: 12h
    renewBefore: 4h

# Pull secret(s) for private images, wired onto the ServiceAccount so pods (and
# hook Jobs) can pull without a manual `kubectl patch sa`. e.g. [{name: ghcr}].
imagePullSecrets: []

serviceAccount:
  create: true
  name: ""

resources:
  requests:
    cpu: 500m
    memory: 256Mi
  limits:
    cpu: 2000m
    memory: 1Gi

podAnnotations:
  prometheus.io/scrape: "true"
  # Scrape the dedicated stats listener (proxies /stats/prometheus from the
  # localhost-only admin), NOT the admin port (9901, now 127.0.0.1-only).
  prometheus.io/port: "9903"
  prometheus.io/path: "/stats/prometheus"

# The image `helm test <release>` runs (templates/tests/): curl, checking that the
# node's Envoy answers. global.imageRegistry applies to it too, so mirror it with
# the others for an air-gapped install.
tests:
  image:
    repository: curlimages/curl
    tag: "8.11.1@sha256:c1fe1679c34d9784c1b0d1e5f62ac0a79fca01fb6377cdd33e90473c6f9f9a69"  # pinned digest
    pullPolicy: IfNotPresent

# No PodDisruptionBudget, HorizontalPodAutoscaler or NetworkPolicy in this chart,
# on purpose: a DaemonSet runs one Envoy per node, so a node drain leaves it be and
# its count follows the nodes, not the load; and a hostNetwork pod is the node
# itself to the network, which no NetworkPolicy selects.

nameOverride: ""
fullnameOverride: ""

global:
  # Pull every image this chart runs from this registry instead of the one each
  # image names: a mirror, or the local registry of an air-gapped install (e.g.
  # registry.internal:5000). The path is kept, so mirror the images under it:
  # ghcr.io/talyvor/edge-osb -> <registry>/talyvor/edge-osb,
  # envoyproxy/envoy -> <registry>/envoyproxy/envoy,
  # redis -> <registry>/library/redis.  "" = each image's own registry.
  imageRegistry: ""
