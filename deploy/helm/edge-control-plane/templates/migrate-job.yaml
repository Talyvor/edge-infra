apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "edge-control-plane.fullname" . }}-migrate
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "edge-control-plane.labels" . | nindent 4 }}
  annotations:
    # Apply BOTH schema sets (control-plane + OSB) to the ONE shared database
    # before the control-plane and OSB Deployments roll out, on every install and
    # upgrade. The runner records applied files in schema_migrations, so a re-run
    # is a no-op even though some migrations are not themselves idempotent.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      # Not the Deployment's selector labels: a migrate pod serves nothing, so the
      # Service and the PodDisruptionBudget must not select it.
      labels:
        app.kubernetes.io/name: {{ include "edge-control-plane.name" . }}-migrate
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ include "edge-control-plane.serviceAccountName" . }}
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532   # the distroless nonroot uid:gid, as the Deployment
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      containers:
        - name: migrate
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          image: {{ include "edge-control-plane.image" (dict "image" .Values.migrate.image "global" .Values.global) | quote }}
          imagePullPolicy: {{ .Values.migrate.image.pullPolicy }}
          env:
            # The SAME shared-DB DSN the control-plane uses (co-location).
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret }}
                  key: {{ .Values.postgres.secretKey }}
          resources:
            {{- toYaml .Values.migrate.resources | nindent 12 }}
