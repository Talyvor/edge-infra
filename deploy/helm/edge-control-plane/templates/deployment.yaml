apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "edge-control-plane.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "edge-control-plane.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "edge-control-plane.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "edge-control-plane.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "edge-control-plane.serviceAccountName" . }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        # Numeric UID/GID is REQUIRED: the distroless image's user is the NAME
        # "nonroot", which the kubelet cannot verify as non-root at admission —
        # runAsNonRoot alone then yields CreateContainerConfigError and the pod
        # never starts. 65532 is the distroless nonroot uid:gid.
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      containers:
        - name: control-plane
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          image: {{ include "edge-control-plane.image" (dict "image" .Values.image "global" .Values.global) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: grpc
              containerPort: 18000
              protocol: TCP
            - name: metrics
              containerPort: 2112
              protocol: TCP
            - name: health
              containerPort: 18001
              protocol: TCP
            {{- if .Values.adminApi.existingSecret }}
            - name: admin
              containerPort: {{ .Values.adminApi.port }}
              protocol: TCP
            {{- end }}
          env:
            - name: XDS_LISTEN_ADDR
              value: {{ .Values.config.xdsListenAddr | quote }}
            - name: XDS_HEALTH_ADDR
              value: {{ .Values.config.xdsHealthAddr | quote }}
            - name: XDS_NODE_ID
              value: {{ .Values.config.xdsNodeId | quote }}
            - name: XDS_RECONCILE_INTERVAL_MS
              value: {{ .Values.config.reconcileIntervalMs | quote }}
            {{- if .Values.adminApi.existingSecret }}
            # Admin READ API — the key's presence is what turns the listener on
            # (the binary fails closed without XDS_ADMIN_API_KEY).
            - name: XDS_ADMIN_ADDR
              value: {{ printf "0.0.0.0:%v" .Values.adminApi.port | quote }}
            - name: XDS_ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.adminApi.existingSecret }}
                  key: {{ .Values.adminApi.secretKey }}
            {{- end }}
            - name: GW_RATELIMIT_ENABLED
              value: {{ .Values.rateLimit.enabled | quote }}
            - name: GW_RATELIMIT_MAX_TOKENS
              value: {{ .Values.rateLimit.maxTokens | quote }}
            - name: GW_RATELIMIT_TOKENS_PER_FILL
              value: {{ .Values.rateLimit.tokensPerFill | quote }}
            - name: GW_RATELIMIT_FILL_INTERVAL_MS
              value: {{ .Values.rateLimit.fillIntervalMs | quote }}
            - name: EXT_AUTHZ_ENABLED
              value: {{ .Values.extAuthz.enabled | quote }}
            - name: EXT_AUTHZ_ADDRESS
              value: {{ .Values.extAuthz.address | quote }}
            - name: EXT_AUTHZ_PORT
              value: {{ .Values.extAuthz.port | quote }}
            {{- if .Values.extAuthz.caFile }}
            - name: EXT_AUTHZ_CA_FILE
              value: {{ .Values.extAuthz.caFile | quote }}
            {{- end }}
            {{- if .Values.extAuthz.certFile }}
            - name: EXT_AUTHZ_CERT_FILE
              value: {{ .Values.extAuthz.certFile | quote }}
            {{- end }}
            {{- if .Values.extAuthz.keyFile }}
            - name: EXT_AUTHZ_KEY_FILE
              value: {{ .Values.extAuthz.keyFile | quote }}
            {{- end }}
            - name: RLS_ENABLED
              value: {{ .Values.rateLimitService.enabled | quote }}
            - name: RLS_ADDRESS
              value: {{ .Values.rateLimitService.address | quote }}
            - name: RLS_PORT
              value: {{ .Values.rateLimitService.port | quote }}
            - name: RLS_DOMAIN
              value: {{ .Values.rateLimitService.domain | quote }}
            {{- if .Values.rateLimitService.caFile }}
            - name: RLS_CA_FILE
              value: {{ .Values.rateLimitService.caFile | quote }}
            {{- end }}
            {{- if .Values.rateLimitService.certFile }}
            - name: RLS_CERT_FILE
              value: {{ .Values.rateLimitService.certFile | quote }}
            {{- end }}
            {{- if .Values.rateLimitService.keyFile }}
            - name: RLS_KEY_FILE
              value: {{ .Values.rateLimitService.keyFile | quote }}
            {{- end }}
            - name: GW_OTEL_ENABLED
              value: {{ .Values.telemetry.otel.enabled | quote }}
            - name: GW_OTEL_COLLECTOR_ADDRESS
              value: {{ .Values.telemetry.otel.address | quote }}
            - name: GW_OTEL_COLLECTOR_PORT
              value: {{ .Values.telemetry.otel.port | quote }}
            - name: GW_OTEL_SERVICE_NAME
              value: {{ .Values.telemetry.otel.serviceName | quote }}
            - name: GW_TRACE_SAMPLE_PERCENT
              value: {{ .Values.telemetry.otel.samplePercent | quote }}
            - name: EGRESS_AGENT_REQUESTS_PER_MINUTE
              value: {{ .Values.egress.agentRequestsPerMinute | quote }}
            - name: EGRESS_DECISION_LOG
              value: {{ .Values.egress.decisionLog | quote }}
            # The Talyvor Edge licence (docs/licence.md): read from the mounted
            # Secret, checked offline, advisory — nothing served depends on it.
            - name: EDGE_LICENCE_FILE
              value: /etc/edge-licence/licence
            {{- with .Values.licence.publicKeys }}
            - name: EDGE_LICENCE_PUBLIC_KEYS
              value: {{ join "," . | quote }}
            {{- end }}
            - name: POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret }}
                  key: {{ .Values.postgres.secretKey }}
            # Encryption-at-rest KEK to decrypt SDS secret keys on load. Optional:
            # absent ⇒ keys read as plaintext. MUST equal the custodian's SECRET_KEK.
            - name: SECRET_KEK
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret }}
                  key: SECRET_KEK
                  optional: true
            # Mid-rotation only: the old KEK(s), comma-separated, so keys not yet
            # re-sealed still open (docs/kek-rotation.md). MUST equal the custodian's.
            - name: SECRET_KEK_PREVIOUS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret }}
                  key: SECRET_KEK_PREVIOUS
                  optional: true
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- if .Values.redis.addr }}
            - name: REDIS_ADDR
              value: {{ .Values.redis.addr | quote }}
            {{- end }}
            {{- if .Values.redis.existingSecret }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.redis.existingSecret }}
                  key: {{ .Values.redis.secretKey }}
            {{- end }}
            {{- with .Values.tls }}
            - name: XDS_TLS_CERT
              value: {{ .mountPath }}/tls.crt
            - name: XDS_TLS_KEY
              value: {{ .mountPath }}/tls.key
            - name: XDS_TLS_CA
              value: {{ .mountPath }}/ca.crt
            {{- end }}
          volumeMounts:
            {{- with .Values.tls }}
            - name: xds-tls
              mountPath: {{ .mountPath }}
              readOnly: true
            {{- end }}
            {{- if .Values.licence.existingSecret }}
            - name: licence
              mountPath: /etc/edge-licence
              readOnly: true
            {{- end }}
          # Readiness gates traffic/rollout on the server having published its
          # first xDS snapshot (/readyz → 503 until then), so a replica that is
          # up but not yet serving config is held out of rotation.
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
          # Liveness stays on the gRPC socket: it tracks the critical xDS port
          # directly and must not depend on the secondary health server, so a
          # health-server hiccup never restarts a working xDS process.
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 15
            periodSeconds: 10
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        {{- with .Values.tls }}
        - name: xds-tls
          secret:
            secretName: {{ .existingSecret }}
        {{- end }}
        {{- with .Values.licence }}
        {{- if .existingSecret }}
        # A whole-directory mount (no subPath), so a renewed licence reaches the
        # pod without a restart. optional: a missing Secret is a missing licence,
        # which must never keep the control plane from starting.
        - name: licence
          secret:
            secretName: {{ .existingSecret }}
            optional: true
            items:
              - key: {{ .secretKey }}
                path: licence
        {{- end }}
        {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
