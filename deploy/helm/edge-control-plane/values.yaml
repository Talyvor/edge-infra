replicaCount: 2

image:
  repository: ghcr.io/talyvor/edge-control-plane
  tag: "447ceb18980fc02fdc7e28db16354c62e3018850"  # pin to the SHA you pushed
  pullPolicy: IfNotPresent

# DB migrator (cmd/migrate) — applies the control-plane + OSB schemas to the
# shared database as a pre-install/pre-upgrade hook (templates/migrate-job.yaml).
# Non-Kubernetes equivalent: `DATABASE_URL=... edge-migrate`. See docs/migrations.md.
migrate:
  image:
    repository: ghcr.io/talyvor/edge-migrate
    tag: "ad3eed7c31f72c3f7892cf9ce1270bacd7a9f13e"  # pin to the SHA you pushed
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }

service:
  type: ClusterIP
  grpcPort: 18000
  metricsPort: 2112

config:
  xdsListenAddr: "0.0.0.0:18000"
  xdsHealthAddr: "0.0.0.0:18001"  # /healthz + /readyz HTTP server (probe target)
  xdsNodeId: "edge-proxy"
  reconcileIntervalMs: 5000

# Admin READ API (cmd/server's fourth listener, /admin/v1/*; consumed by the
# talyvor-suite BFF). READ-ONLY by design — it reports topology/nodes/certs/
# provisioning/effective-config and can change nothing. OPT-IN and fail-closed
# twice over: the binary refuses to start the listener without a key, and this
# chart wires neither the env nor the port unless existingSecret is set — the
# DEFAULT ("") keeps the surface nonexistent. The key itself lives in a Secret
# created out of band; it is never a plain value here.
adminApi:
  port: 18002
  existingSecret: ""            # Secret holding the admin key; "" ⇒ admin API off
  secretKey: "admin-api-key"    # key within that Secret

# Gateway HTTP rate limiting (Envoy local_ratelimit, per listener, per Envoy
# instance). Fail-open: a limiter problem never blocks traffic. Defaults are
# generous (100 req/s, burst 200) so only floods are throttled.
rateLimit:
  enabled: true
  maxTokens: 200       # burst size
  tokensPerFill: 100   # tokens refilled each interval
  fillIntervalMs: 1000

# Gateway ext_authz (Envoy → auth-service gRPC). FAIL-CLOSED: if the
# auth-service is unreachable Envoy denies.
#
# ON BY DEFAULT (B28.206), because off cannot publish: an OSB service defaults to
# auth_policy='jwt', and the reconciler refuses to build ANY snapshot while a
# route wants auth and ext_authz is off (CFG-1) — so with this off, the first
# normally-provisioned service froze the whole gateway. On, the same service is
# gated (401 without a token, 200 with one) and nothing else changes:
# auth_policy='none' routes are per-route Disabled and never call the
# auth-service, so they serve even while it is down; only jwt routes deny then.
#
# Needs, on the same install: the auth-service and edge-issuer charts (the
# auth-service fetches the issuer's JWKS before it listens) and the
# envoy-authz-client-tls-secret that edge-proxy mounts (the edge-proxy chart
# issues it while its extAuthz.clientTLS.enabled is on, the default). A cluster that turns this off again with a jwt route present freezes
# on last-good — docs/ext-authz-cutover-and-rollback.md.
extAuthz:
  enabled: true
  address: auth-service.infra.svc.cluster.local
  port: 50051
  # Upstream mTLS cert paths AS MOUNTED ON THE ENVOY (edge-proxy) POD — the proxy
  # reads them, not the control plane; the reconciler only renders these path
  # strings into the ext_authz cluster (and only when enabled). The auth-service
  # requires client-cert verification (AUTH_TLS_CA), so all three MUST be set and
  # MUST match the edge-proxy mount (edge-proxy values extAuthz.clientTLS.mountPath
  # = /etc/authz-client-tls, secret envoy-authz-client-tls-secret). caFile presence
  # is what makes the reconciler render TLS (vs plaintext → deny-all).
  caFile: /etc/authz-client-tls/ca.crt
  certFile: /etc/authz-client-tls/tls.crt
  keyFile: /etc/authz-client-tls/tls.key

# Gateway rate-limit service (Envoy global ratelimit → RLS over gRPC) — the
# cross-instance, identity-keyed shared layer. FAIL-OPEN: if the RLS is
# unreachable Envoy allows and the per-instance local_ratelimit floor still
# applies. Opt-in (default off; needs the auth front so x-user-id flows).
rateLimitService:
  enabled: false
  address: edge-ratelimit.infra.svc.cluster.local
  port: 8082
  domain: edge
  # Upstream mTLS cert paths AS MOUNTED ON THE ENVOY (edge-proxy) POD. The
  # edge-ratelimit server requires a client certificate from the internal CA, so
  # the default is Envoy's ext_authz client certificate (extAuthz above).
  caFile: /etc/authz-client-tls/ca.crt
  certFile: /etc/authz-client-tls/tls.crt
  keyFile: /etc/authz-client-tls/tls.key

# Gateway access logs and tracing. Every listener ALWAYS writes one JSON access
# line per request to the edge-proxy's stdout (request_id, trace_id, status,
# route, upstream, duration — the path without its query string), and every
# response carries the x-request-id it was logged under.
#
# telemetry.otel additionally ships each listener's access record and an
# OpenTelemetry span per sampled request to a collector over OTLP/gRPC. The
# default address is the collector `make observe` installs (traces → Tempo,
# logs → Loki). Opt-in; FAIL-OPEN: a collector that is down loses telemetry,
# never a request.
telemetry:
  otel:
    enabled: false
    address: otel-collector.monitoring.svc.cluster.local
    port: 4317
    serviceName: edge-proxy
    samplePercent: 100   # share of requests traced, 0–100

# edge-egress (B28.228).
#
# agentRequestsPerMinute: how many requests each agent may send through
# edge-egress in a minute. An agent is the ServiceAccount it proved to the
# auth-service (keyless destinations), and the pod address its requests come
# from; over the limit it gets 429 with Retry-After. Counted on each edge-egress
# Envoy, so with N replicas an agent can send up to N times this. 0 = no limit.
#
# decisionLog: record every request edge-egress decides — sent on, refused, or
# refused for the rate limit — in the hash-chained edge_decisions table. Export
# it with GET /admin/v1/decisions (adminApi) and check it with
# scripts/verify-decisions.sh. See docs/agent-egress.md.
egress:
  agentRequestsPerMinute: 0
  decisionLog: true

# The Talyvor Edge licence (docs/licence.md). Put the licence Talyvor gave you in
# a Secret and name it here:
#   kubectl -n infra create secret generic edge-licence --from-file=licence=licence.txt
# The control plane checks it offline, logs a warning while it is missing, cannot
# be verified or has expired, and exports edge_licence_valid (1 or 0) and
# edge_licence_expiry_timestamp_seconds. It is advisory: an expired or missing
# licence never changes what Edge serves. To renew, update the Secret; the
# metric reads the new licence within a minute or two, with no restart.
licence:
  existingSecret: ""   # Secret holding the licence; "" = none installed
  secretKey: licence   # key within that Secret
  # Public keys trusted beside the ones built into Edge (base64 of the raw 32
  # bytes). Leave empty unless Talyvor tells you otherwise.
  publicKeys: []

# R4 CO-LOCATION: this DSN and the edge-osb DATABASE_URL must reference the SAME
# Postgres database (both schemas applied there), so the OSB translator can write
# derived data-plane rows in the same transaction as the services row.
# See docs/osb-translator-stage1.md.
postgres:
  existingSecret: edge-control-plane-postgres
  secretKey: dsn

# HA — leave redis.addr empty to run in single-instance mode.
# Set redis.addr to enable shared snapshot hash/version and instance heartbeats
# across all control-plane replicas.
redis:
  addr: ""          # e.g. "redis-master.infra.svc.cluster.local:6379"
  existingSecret: "" # Secret with key "password"; leave empty if no auth
  secretKey: password

tls:
  existingSecret: edge-cp-tls-secret  # issued by this chart (certificate.*)
  mountPath: /etc/xds-tls

# The certificate in tls.existingSecret, issued by cert-manager when the chart is
# installed, so no certificate is applied by hand. The issuer is the edge-pki
# chart's internal CA unless issuerRef names your own. create: false to bring the
# Secret yourself. dnsNames: [] = the names of this chart's Service.
certificate:
  create: true
  issuerRef:
    name: edge-internal-ca
    kind: ClusterIssuer
  dnsNames: []
  duration: 24h
  renewBefore: 8h

# Pull secret(s) for private images, wired onto the ServiceAccount so pods (and
# hook Jobs) can pull without a manual `kubectl patch sa`. e.g. [{name: ghcr}].
imagePullSecrets: []

serviceAccount:
  create: true
  name: ""

resources:
  requests:
    cpu: 200m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "2112"

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app: edge-control-plane
          topologyKey: kubernetes.io/hostname

# Spread the copies across nodes and zones: Kubernetes topologySpreadConstraints,
# as written, each with a labelSelector on app: edge-control-plane. Empty = the
# scheduler decides; deploy/profiles/ha sets it.
topologySpreadConstraints: []

# PodDisruptionBudget: a voluntary disruption (a node drain, a cluster upgrade)
# evicts at most maxUnavailable of these pods at once. Set minAvailable to keep a
# floor instead; when it is set it is used in place of maxUnavailable.
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

# HorizontalPodAutoscaler (autoscaling/v2) on CPU, off by default. While it is on
# it owns the replica count (replicaCount is not rendered), and it needs the
# cluster's metrics API (metrics-server). There is no default ceiling: set
# maxReplicas when you switch it on.
#   minReplicas                     default: replicaCount
#   targetCPUUtilizationPercentage  default: Kubernetes' own (80)
autoscaling:
  enabled: false

# The image `helm test <release>` runs (templates/tests/): curl, checking that the
# release answers through its Service. global.imageRegistry applies to it too, so
# mirror it with the others for an air-gapped install.
tests:
  image:
    repository: curlimages/curl
    tag: "8.11.1@sha256:c1fe1679c34d9784c1b0d1e5f62ac0a79fca01fb6377cdd33e90473c6f9f9a69"  # pinned digest
    pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

# NetworkPolicy (B27.33): default-deny ingress to this chart's pods, allowing
# only the flows in templates/networkpolicy.yaml. Enforced by Calico (or any
# CNI that enforces NetworkPolicy). OFF in the base values, like extAuthz:
# ArgoCD syncs base values, and switching it on without the right gatewayCIDRs
# cuts the gateway off. Switch it on per install, with that cluster's CIDRs.
networkPolicy:
  # On by default (B50.8): only the flows the policy lists reach these pods.
  # Set gatewayCIDRs below to your nodes' CIDR(s); enabled: false opts out.
  enabled: true
  # CIDR(s) of the nodes running edge-proxy. Envoy runs hostNetwork, so its
  # traffic carries the NODE IP, which no pod or namespace selector matches.
  # Required when enabled — the chart refuses to render without it.
  gatewayCIDRs: []
  # Pods in this namespace count as the gateway too.
  gatewayNamespace: edge
  # More ingress rules, appended as written, e.g. Prometheus on the metrics port:
  #   - from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}}]
  #     ports: [{port: metrics}]
  extraIngress: []

global:
  # Pull every image this chart runs from this registry instead of the one each
  # image names: a mirror, or the local registry of an air-gapped install (e.g.
  # registry.internal:5000). The path is kept, so mirror the images under it:
  # ghcr.io/talyvor/edge-osb -> <registry>/talyvor/edge-osb,
  # envoyproxy/envoy -> <registry>/envoyproxy/envoy,
  # redis -> <registry>/library/redis.  "" = each image's own registry.
  imageRegistry: ""
