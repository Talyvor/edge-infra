api:
  replicaCount: 2
  image:
    repository: ghcr.io/talyvor/edge-osb
    tag: "447ceb18980fc02fdc7e28db16354c62e3018850"  # pin to the SHA you pushed
    pullPolicy: IfNotPresent
  port: 8080
  # Spread the API's copies across nodes and zones: Kubernetes
  # topologySpreadConstraints, as written, each with its own labelSelector
  # (app: edge-osb, component: api). Empty = the scheduler decides.
  # deploy/profiles/ha sets it.
  topologySpreadConstraints: []
  # HorizontalPodAutoscaler (autoscaling/v2) on CPU for the api, off by default.
  # While it is on it owns api.replicaCount, and it needs the cluster's metrics
  # API (metrics-server). There is no default ceiling: set maxReplicas when you
  # switch it on. minReplicas defaults to replicaCount, and
  # targetCPUUtilizationPercentage to Kubernetes' own (80).
  autoscaling:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

worker:
  replicaCount: 2
  # HorizontalPodAutoscaler (autoscaling/v2) on CPU for the worker, off by default.
  # While it is on it owns worker.replicaCount, and it needs the cluster's metrics
  # API (metrics-server). There is no default ceiling: set maxReplicas when you
  # switch it on. minReplicas defaults to replicaCount, and
  # targetCPUUtilizationPercentage to Kubernetes' own (80).
  autoscaling:
    enabled: false
  image:
    repository: ghcr.io/talyvor/edge-osb
    tag: "447ceb18980fc02fdc7e28db16354c62e3018850"  # pin to the SHA you pushed
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

config:
  # All process config (DATABASE_URL, NATS_URL, …) is pulled from this secret
  # via envFrom.
  #
  # THE PROVISIONING API IS NOT GATED BY ANY VALUE IN THIS SECRET. It is gated
  # per tenant: callers send `Authorization: Bearer <key>`, the broker SHA-256s
  # it and looks it up in the `tenant_api_keys` table (keys are never stored in
  # the clear). The row's team is the caller's ONLY tenant — a request body can
  # never name another one. 401 with no bearer, 403 when unrecognized. There is
  # nothing to set here to turn that on: it is on, and OSB REFUSES TO START when
  # `tenant_api_keys` is empty (see startup_tenancy_check).
  #
  # ⚠ This block previously documented an `API_KEY` here as the provisioning
  # gate. No such setting has ever existed — Settings is `extra="ignore"`, so an
  # operator who set it got no error and no gate, only the belief they had
  # configured one. The per-tenant scheme above replaced that never-built
  # shared-key design. tests/test_chart_config_contract.py now fails if any key
  # documented in this block is not a field the process actually reads.
  #
  # Access-control settings that DO live in this secret (ISO 27001 A.9):
  #   - ADMIN_API_KEY  gates /metrics. Callers (incl. Prometheus) must send a
  #                    matching X-Admin-Key header. Enabling it requires the
  #                    scrape job to inject the header (see podAnnotations below).
  #                    ⚠ UNSET = OPEN: /metrics is unauthenticated by default,
  #                    and this chart supplies no value for it. Set it here if
  #                    the metrics surface must be closed.
  existingSecret: edge-osb-secrets

# Port of the shared HTTPS listener every OSB HTTPS service lands on (the
# worker writes it onto the osb-shared-https gateway). Change it when :443 on the
# edge nodes already belongs to another gateway or ingress.
sharedHttpsPort: 443

# Transport security (ISO 27001 A.13). When `tls` is set, the OSB mounts its
# cert-manager-issued secret and is told to use verify-full Postgres TLS and
# mutual NATS TLS. Leave unset for local/plaintext dev.
tls:
  existingSecret: osb-client-tls-secret  # issued by this chart (certificate.*)
  mountPath: /etc/osb-tls
  dbSslMode: verify-full

# The certificate in tls.existingSecret, issued by cert-manager when the chart is
# installed, so no certificate is applied by hand. The issuer is the edge-pki
# chart's internal CA unless issuerRef names your own. create: false to bring the
# Secret yourself. dnsNames: [] = the names of this chart's Service.
certificate:
  create: true
  issuerRef:
    name: edge-internal-ca
    kind: ClusterIssuer
  dnsNames: []
  duration: 2160h   # 90 days
  renewBefore: 360h # 15 days

# Pull secret(s) for private images, wired onto the ServiceAccount so pods (and
# hook Jobs) can pull without a manual `kubectl patch sa`. e.g. [{name: ghcr}].
imagePullSecrets: []

serviceAccount:
  create: true
  name: ""

# Closing /metrics (ISO 27001 A.9). UNSET = OPEN: with no key the broker serves
# /metrics to anyone who can reach the pod, which is the default this chart ships.
#
# Set existingSecret + secretKey to wire ADMIN_API_KEY via secretKeyRef (the same
# shape edge-control-plane uses for XDS_ADMIN_API_KEY) instead of hand-editing the
# config secret. The process then requires a matching X-Admin-Key header: 401
# without one, 403 with a wrong one.
#
# ⚠ WHAT YOU MUST ALSO CHANGE, AND WHY THE CHART ENFORCES IT. Annotation-based
# scraping CANNOT attach a header, so turning this on while `podAnnotations` still
# carries prometheus.io/scrape would leave Prometheus 401ing on every scrape —
# metrics silently stop, and a metrics surface that quietly stops being scraped is
# its own defect. The chart REFUSES that combination (see the fail() in
# templates/deployment.yaml) rather than rendering it. Switch to a ServiceMonitor
# whose endpoint carries `headers: {X-Admin-Key: <key>}` and drop the annotations.
#
# /healthz and /readyz stay open for kubelet probes either way.
metricsAuth:
  existingSecret: ""      # e.g. edge-osb-secrets
  secretKey: ADMIN_API_KEY

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"

# PodDisruptionBudgets, one for the api and one for the worker: a voluntary
# disruption (a node drain, a cluster upgrade) evicts at most maxUnavailable of
# each at once. Set minAvailable to keep a floor instead; when it is set it is
# used in place of maxUnavailable.
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

# The image `helm test <release>` runs (templates/tests/): curl, checking that the
# release answers through its Service. global.imageRegistry applies to it too, so
# mirror it with the others for an air-gapped install.
tests:
  image:
    repository: curlimages/curl
    tag: "8.11.1@sha256:c1fe1679c34d9784c1b0d1e5f62ac0a79fca01fb6377cdd33e90473c6f9f9a69"  # pinned digest
    pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

# NetworkPolicy (B27.33): default-deny ingress to this chart's pods, allowing
# only the flows in templates/networkpolicy.yaml. Enforced by Calico (or any
# CNI that enforces NetworkPolicy). OFF in the base values, like extAuthz:
# ArgoCD syncs base values, and switching it on without the right gatewayCIDRs
# cuts the gateway off. Switch it on per install, with that cluster's CIDRs.
networkPolicy:
  enabled: false
  # CIDR(s) of the nodes running edge-proxy. Envoy runs hostNetwork, so its
  # traffic carries the NODE IP, which no pod or namespace selector matches.
  # Required when enabled — the chart refuses to render without it.
  gatewayCIDRs: []
  # Pods in this namespace count as the gateway too.
  gatewayNamespace: edge
  # More ingress rules, appended as written, e.g. Prometheus on the metrics port:
  #   - from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}}]
  #     ports: [{port: metrics}]
  extraIngress: []

global:
  # Pull every image this chart runs from this registry instead of the one each
  # image names: a mirror, or the local registry of an air-gapped install (e.g.
  # registry.internal:5000). The path is kept, so mirror the images under it:
  # ghcr.io/talyvor/edge-osb -> <registry>/talyvor/edge-osb,
  # envoyproxy/envoy -> <registry>/envoyproxy/envoy,
  # redis -> <registry>/library/redis.  "" = each image's own registry.
  imageRegistry: ""
