{{- /*
⚠ REFUSE A CONFIGURATION THAT SILENTLY STOPS METRICS.

Annotation-based scraping cannot attach a header, so closing /metrics with
metricsAuth while podAnnotations still asks Prometheus to scrape would leave every
scrape 401ing. Nothing would alert: the endpoint answers, the pod is healthy, and
the series simply stop arriving. That is the same silent-degradation shape this
repo keeps closing, so the chart refuses to render it rather than letting an
operator discover it from a gap in a dashboard weeks later.
*/ -}}
{{- if and .Values.metricsAuth.existingSecret (index (default (dict) .Values.podAnnotations) "prometheus.io/scrape") }}
{{- fail "edge-osb: metricsAuth is set (so /metrics requires an X-Admin-Key header) while podAnnotations still contains prometheus.io/scrape. Annotation scraping cannot send a header, so every scrape would 401 and metrics would silently stop. Remove the prometheus.io/* podAnnotations and scrape with a ServiceMonitor whose endpoint carries headers: {X-Admin-Key: <key>}." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "edge-osb.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "edge-osb.labels" . | nindent 4 }}
    component: api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "edge-osb.apiSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "edge-osb.apiSelectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "edge-osb.serviceAccountName" . }}
      {{- with .Values.api.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        # Numeric UID/GID is REQUIRED: the distroless image's user is the NAME
        # "nonroot", which the kubelet cannot verify as non-root at admission —
        # runAsNonRoot alone then yields CreateContainerConfigError and the pod
        # never starts. 65532 is the distroless nonroot uid:gid.
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      containers:
        - name: api
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          image: {{ include "edge-osb.image" (dict "image" .Values.api.image "global" .Values.global) | quote }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          command:
            - uvicorn
            - main:app
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8080"
            - "--workers"
            - "2"
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
              protocol: TCP
          {{- if .Values.metricsAuth.existingSecret }}
          # /metrics gate. Wired explicitly rather than left to a hand-edited config
          # secret so "is the metrics surface closed" is answerable from the values file.
          env:
            - name: ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.metricsAuth.existingSecret }}
                  key: {{ .Values.metricsAuth.secretKey }}
          {{- end }}
          envFrom:
            - secretRef:
                name: {{ .Values.config.existingSecret }}
          {{- with .Values.tls }}
          env:
            - name: DB_SSL_MODE
              value: {{ .dbSslMode | default "verify-full" | quote }}
            - name: DB_TLS_CA
              value: {{ .mountPath }}/ca.crt
            - name: NATS_TLS_CA
              value: {{ .mountPath }}/ca.crt
            - name: NATS_TLS_CERT
              value: {{ .mountPath }}/tls.crt
            - name: NATS_TLS_KEY
              value: {{ .mountPath }}/tls.key
          {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          {{- with .Values.tls }}
          volumeMounts:
            - name: osb-tls
              mountPath: {{ .mountPath }}
              readOnly: true
          {{- end }}
      {{- with .Values.tls }}
      volumes:
        - name: osb-tls
          secret:
            secretName: {{ .existingSecret }}
      {{- end }}
