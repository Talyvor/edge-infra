# edge-datastores — the three datastores Talyvor Edge runs on.
#
#   bundled (the default): Postgres, Redis and NATS (JetStream) run in this
#     release's namespace, each on its own PersistentVolumeClaim.
#   external: set <store>.enabled=false and fill external.<store> with your own.
#     Mixing is fine — e.g. your managed Postgres with the bundled Redis and NATS.
#
# Either way the release writes ONE connection Secret (global.datastores.secretName)
# and, after install and every upgrade, applies the control-plane + OSB schema to
# the edge database. See README.md.

global:
  datastores:
    # The connection Secret. Keys: POSTGRES_DSN, ISSUER_DATABASE_URL, REDIS_ADDR,
    # REDIS_PASSWORD, NATS_URL (+ POSTGRES_PASSWORD / NATS_TOKEN when bundled).
    secretName: edge-datastores
    # false = you create that Secret yourself, with the keys above, before you
    # install (e.g. from a secrets manager). The chart then only reads it.
    createSecret: true
  # Pull secrets for every pod here, e.g. [{name: ghcr}].
  imagePullSecrets: []
  # Pull every image here (Postgres, Redis, NATS, the schema job) from this
  # registry instead, the path kept: redis -> <registry>/library/redis,
  # ghcr.io/talyvor/edge-migrate -> <registry>/talyvor/edge-migrate.
  # "" = each image's own registry.
  imageRegistry: ""

# ---- bundled datastores (subcharts in charts/) -------------------------------
postgres:
  enabled: true
  auth:
    username: edge
    database: edge          # the shared control-plane + OSB database
    # "" = generated once and kept across upgrades. Under Argo CD (which renders
    # with `helm template`, so nothing can be looked up) set it, or bring your
    # own Secret with global.datastores.createSecret=false.
    password: ""
  # Created on first start next to `database`. edge-issuer keeps its own.
  extraDatabases: [issuer]
  persistence:
    enabled: true
    size: 8Gi
    storageClass: ""        # "" = the cluster default

redis:
  enabled: true
  auth:
    password: ""            # "" = generated once and kept across upgrades
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""

nats:
  enabled: true
  auth:
    token: ""               # "" = generated once and kept across upgrades
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""

# NetworkPolicy: default-deny ingress to the bundled Postgres, Redis and NATS,
# each open on its own port to this release's own pods (the migration, the
# backups, `helm test`) and to the clients below. Enforced by Calico (or any CNI
# that enforces NetworkPolicy). OFF in the base values, like every chart's.
networkPolicy:
  enabled: false
  # NetworkPolicy peers that may reach all three. The default is Talyvor Edge's
  # own services, and their schema migrations, in this namespace; running them in
  # another, add a namespaceSelector to the entry.
  clients:
    - podSelector:
        matchExpressions:
          - key: app.kubernetes.io/name
            operator: In
            values:
              - edge-control-plane
              - edge-control-plane-migrate
              - edge-osb
              - edge-issuer
              - edge-issuer-migrate
              - edge-secrets
              - edge-ratelimit
  # More ingress rules, appended to each store's policy as written.
  extraIngress: []

# ---- external datastores (used for any store whose enabled is false) ---------
external:
  postgres:
    dsn: ""                 # postgres://user:pass@host:5432/edge?sslmode=verify-full
    issuerDsn: ""           # edge-issuer's own database; optional
  redis:
    addr: ""                # host:6379; optional — the control plane runs without it
    password: ""
  nats:
    url: ""                 # nats://[token@]host:4222, JetStream on; optional unless you run edge-osb

# ---- schema migration ---------------------------------------------------------
# cmd/migrate applies the control-plane and OSB migrations to the edge database
# after install and after every upgrade (a no-op when nothing is new). A Postgres
# that is still starting fails an attempt, and the Job retries it (backoffLimit).
migrate:
  enabled: true
  image:
    repository: ghcr.io/talyvor/edge-migrate
    tag: "ad3eed7c31f72c3f7892cf9ce1270bacd7a9f13e"  # pin to the SHA you pushed
    pullPolicy: IfNotPresent
  backoffLimit: 6
  # How long the Job may take, retries included.
  activeDeadlineSeconds: 600
  resources: {}

# ---- backup and restore -------------------------------------------------------
# A CronJob dumps every database below (pg_dump, custom format) and uploads the
# dumps, with a sha256 MANIFEST, to your S3 bucket under <prefix><timestamp>/,
# then points <prefix>LATEST at it — so a backup that failed halfway is never the
# one a restore picks. Works with AWS S3, MinIO or any S3-compatible store, and
# with bundled and external Postgres alike. Expire old backups with a lifecycle
# rule on the bucket.
#
# Restoring is one command; the chart renders the restore Job as a suspended
# CronJob, so nothing restores until you ask:
#
#   kubectl -n <ns> create job --from=cronjob/<release>-restore restore-$(date +%s)
#
# It downloads the backup named by backup.restoreFrom, checks every dump against
# the MANIFEST, and restores each database in one transaction (all of it or none
# of it). Back up now, outside the schedule:
#
#   kubectl -n <ns> create job --from=cronjob/<release>-backup backup-$(date +%s)
#
# The backup holds SDS keys as they are stored: sealed under SECRET_KEK when you
# set one. Keep that key apart from the bucket — a restore without it serves
# nothing that is sealed. See README.md.
backup:
  enabled: false
  schedule: "0 3 * * *"
  # The databases each backup holds, read from the connection Secret
  # (global.datastores.secretName) unless an entry names its own secretName.
  # optional: skipped when that Secret has no such key.
  databases:
    - name: edge                    # control plane + OSB
      key: POSTGRES_DSN
    - name: issuer                  # edge-issuer
      key: ISSUER_DATABASE_URL
      optional: true
  # More databases in the same backup — e.g. Lens's own, so one restore brings
  # back both. Each from a Secret key holding its postgres:// URL:
  #   - name: lens
  #     secretName: lens-database
  #     key: DATABASE_URL
  extraDatabases: []
  s3:
    endpoint: ""                    # "" = AWS S3; e.g. http://minio.backup.svc:9000
    region: us-east-1
    bucket: ""                      # required
    prefix: "edge/"
    # A Secret you create with AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY. Required.
    existingSecret: ""
    # Path-style URLs (endpoint/bucket/key). MinIO and most S3-compatible stores
    # need it; AWS S3 accepts it.
    forcePathStyle: true
  # What the restore Job restores: latest, or a timestamp a backup printed (and
  # the folder name under the prefix), e.g. 20261006T030000Z.
  restoreFrom: latest
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  # pg_dump and pg_restore must be at least your Postgres server's major version.
  images:
    postgres:
      repository: postgres
      tag: "16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea"
      pullPolicy: IfNotPresent
    s3:
      repository: amazon/aws-cli
      tag: "2.37.9@sha256:92de75724b6a746951f0e8b915d86bbccd7cb55aff96cd0cb4f7017272160780"
      pullPolicy: IfNotPresent
  resources: {}
