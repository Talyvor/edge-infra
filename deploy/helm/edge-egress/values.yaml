# edge-egress — the egress gateway agents send their outbound calls through
# (B28.222). Each Envoy here connects to the control plane as node
# "edge-egress/<pod name>" and receives only the egress snapshot: one proxy
# listener that reaches the hosts in the egress_destinations table and answers
# 403 for every other host. No gateway listener, route or key reaches it.
#
# Agents use it as their proxy:
#   http_proxy=http://edge-egress.<namespace>.svc:3128   # TLS originated and verified here
#   https_proxy=http://edge-egress.<namespace>.svc:3128  # CONNECT, the agent's TLS end to end
image:
  repository: envoyproxy/envoy
  tag: v1.39.2@sha256:460f8c329f24b2e1c7c5af64cb314a6f351ad1c262ba77b135ac46b35ebd5f85  # pinned digest
  pullPolicy: IfNotPresent

# The init container that writes this node's id into the Envoy bootstrap.
bootstrapImage:
  repository: busybox
  tag: "1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662"  # pinned digest

replicaCount: 2

proxy:
  # MUST equal the control plane's EGRESS_LISTENER_PORT (default 3128): the
  # listener is rendered by the control plane; this only names the port the pod
  # and Service expose.
  port: 3128

xds:
  controlPlaneHost: edge-control-plane.infra.svc.cluster.local
  controlPlanePort: 18000
  tls:
    # mTLS to the control-plane xDS server, which requires client certs
    # unconditionally and serves this chart's certificate (envoy-egress-xds-client,
    # issued below) egress nodes only. Install this chart in edge-proxy's
    # namespace (the control plane's NetworkPolicy admits xDS from that namespace).
    enabled: true
    existingSecret: envoy-egress-xds-client-tls-secret
    mountPath: /etc/xds-client-tls

# The xDS client certificate in xds.tls.existingSecret, issued by cert-manager
# from the edge-pki chart's internal CA. create: false to bring the Secret yourself.
certificate:
  create: true
  issuerRef:
    name: edge-internal-ca
    kind: ClusterIssuer
  duration: 2160h   # 90 days
  renewBefore: 360h # 15 days

# ext_authz client certificate (edge-egress -> auth-service mTLS), used by
# keyless destinations (B28.224): their requests are checked by the auth-service
# in agent mode, which removes the agent's credentials and signs the transit
# assertion. The control plane renders the auth-service cluster with its own
# extAuthz.caFile/certFile/keyFile, so mountPath MUST be their directory — the
# same secret and path edge-proxy mounts.
extAuthz:
  clientTLS:
    enabled: true
    existingSecret: envoy-authz-client-tls-secret
    mountPath: /etc/authz-client-tls

# Pull secret(s) for private images, wired onto the ServiceAccount.
imagePullSecrets: []

serviceAccount:
  create: true
  name: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9903"
  prometheus.io/path: "/stats/prometheus"

# Spread the copies across nodes and zones: Kubernetes topologySpreadConstraints,
# as written, each with a labelSelector on app: edge-egress. Empty = the
# scheduler decides; deploy/profiles/ha sets it.
topologySpreadConstraints: []

# PodDisruptionBudget: a voluntary disruption (a node drain, a cluster upgrade)
# evicts at most maxUnavailable of these pods at once. Set minAvailable to keep a
# floor instead; when it is set it is used in place of maxUnavailable.
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

# HorizontalPodAutoscaler (autoscaling/v2) on CPU, off by default. While it is on
# it owns the replica count (replicaCount is not rendered), and it needs the
# cluster's metrics API (metrics-server). There is no default ceiling: set
# maxReplicas when you switch it on.
#   minReplicas                     default: replicaCount
#   targetCPUUtilizationPercentage  default: Kubernetes' own (80)
autoscaling:
  enabled: false

# The image `helm test <release>` runs (templates/tests/): curl, checking that the
# release answers through its Service. global.imageRegistry applies to it too, so
# mirror it with the others for an air-gapped install.
tests:
  image:
    repository: curlimages/curl
    tag: "8.11.1@sha256:c1fe1679c34d9784c1b0d1e5f62ac0a79fca01fb6377cdd33e90473c6f9f9a69"  # pinned digest
    pullPolicy: IfNotPresent

# NetworkPolicy: default-deny ingress to edge-egress, allowing only the agents'
# namespaces (to the proxy port) and this chart's own `helm test` pod. Enforced by
# Calico (or any CNI that enforces NetworkPolicy). OFF in the base values, like
# every chart's: switch it on per install, naming that cluster's agents.
networkPolicy:
  # On by default (B50.8): only the flows the policy lists reach these pods.
  enabled: true
  # Namespaces whose pods may use the proxy, as namespace label selectors. The
  # default is the label that also locks a namespace's own egress to edge-egress
  # (k8s/policies/agent-egress-lockdown.yaml). Required when enabled.
  clientNamespaceSelectors:
    - matchLabels:
        talyvor.io/agents: "true"
  # More ingress rules, appended as written, e.g. Prometheus on the stats port:
  #   - from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}}]
  #     ports: [{port: stats}]
  extraIngress: []

nameOverride: ""
fullnameOverride: ""

global:
  # Pull every image this chart runs from this registry instead of the one each
  # image names: a mirror, or the local registry of an air-gapped install (e.g.
  # registry.internal:5000). The path is kept, so mirror the images under it:
  # ghcr.io/talyvor/edge-osb -> <registry>/talyvor/edge-osb,
  # envoyproxy/envoy -> <registry>/envoyproxy/envoy,
  # redis -> <registry>/library/redis.  "" = each image's own registry.
  imageRegistry: ""
