apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: edge-control-plane
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: edge-infra
  source:
    repoURL: https://github.com/Talyvor/edge-infra
    targetRevision: HEAD
    path: deploy/helm/edge-control-plane
    helm:
      valueFiles:
        - values.yaml
        - ../../profiles/ha/edge-control-plane.yaml
      parameters:
        # The CIDR(s) of the nodes running edge-proxy: the NetworkPolicy (on
        # by default) admits the gateway from these addresses only.
        - name: networkPolicy.gatewayCIDRs[0]
          value: "10.0.0.0/16"
  destination:
    server: https://kubernetes.default.svc
    namespace: infra
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        maxDuration: 3m
        factor: 2
  ignoreDifferences:
    - group: ""
      kind: Secret
      jsonPointers:
        - /data
  revisionHistoryLimit: 10
