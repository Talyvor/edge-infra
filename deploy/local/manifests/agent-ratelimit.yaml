# Phase 31 — an agent for the per-agent rate limit (B28.228), in Phase 29's
# locked namespace. __SA__ and __POD__ are substituted by up.sh: two pods share
# one ServiceAccount (one agent), a third has its own.
#
# It calls keyless mock-llm with its ServiceAccount token, projected for the
# edge-egress audience, so the auth-service names it to edge-egress.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: __SA__
  namespace: agents-locked
automountServiceAccountToken: false
---
apiVersion: v1
kind: Pod
metadata:
  name: __POD__
  namespace: agents-locked
  labels: {app: agent}
spec:
  serviceAccountName: __SA__
  securityContext: {runAsUser: 1000, runAsGroup: 1000, runAsNonRoot: true}
  containers:
    - name: agent
      securityContext: {allowPrivilegeEscalation: false}
      image: __CURL__
      command: ["sleep", "infinity"]
      volumeMounts:
        - {name: edge-token, mountPath: /var/run/secrets/talyvor, readOnly: true}
  volumes:
    - name: edge-token
      projected:
        sources:
          - serviceAccountToken: {audience: edge-egress, expirationSeconds: 600, path: token}
