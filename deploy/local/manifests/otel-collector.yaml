# Phase 24's OpenTelemetry collector: OTLP/gRPC in, every span and log record
# printed in full by the debug exporter, so the run can read them back from the
# pod log. It answers at otel-collector.monitoring.svc.cluster.local:4317 — the
# address the edge-control-plane chart's telemetry.otel defaults to, and where
# `make observe` puts the real collector (observability/k8s/otel-collector, the
# same image, exporting to Tempo and Loki instead).
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: monitoring
data:
  collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
    exporters:
      debug:
        verbosity: detailed
    service:
      pipelines:
        traces:
          receivers: [otlp]
          exporters: [debug]
        logs:
          receivers: [otlp]
          exporters: [debug]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: monitoring
  labels:
    app: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001}
      containers:
        - name: otel-collector
          securityContext: {allowPrivilegeEscalation: false}
          image: otel/opentelemetry-collector-contrib:0.102.0@sha256:26bce721ca2f83db1c2c4e8873514dfe5b3973401fe88a1208efdc74e32840c1
          args: ["--config=/etc/otel/collector-config.yaml"]
          ports:
            - name: otlp-grpc
              containerPort: 4317
          readinessProbe:
            tcpSocket:
              port: 4317
          volumeMounts:
            - name: config
              mountPath: /etc/otel
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: monitoring
spec:
  type: ClusterIP
  selector:
    app: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
