name: Kind Observability

# Runs `make kind-observability` — the edge-observability chart on a throwaway
# kind cluster: installed as its values.yaml says, every rule in rules/ loaded
# and evaluated by Prometheus, then requests through an Envoy set up like
# edge-proxy. Passes only if Grafana's Request Traffic dashboard shows that
# Envoy's request rate (none before, above zero after, the counter equal to the
# requests sent) and a log record and a span come back out of Loki and Tempo
# through Grafana; then the cluster is deleted (B28.235).
on:
  # Nightly on main too: an image or a Grafana/Prometheus API drifting shows up
  # the next morning. internal/ciguard fails if a workflow has no schedule (B28.199).
  schedule:
    - cron: '47 4 * * *'
  push:
    branches: [main]
    paths:
      - 'deploy/helm/edge-observability/**'
      - 'deploy/local/observability.sh'
      - 'deploy/local/manifests/observability-gateway.yaml'
      - 'deploy/local/lib.sh'
      # Everything deploy/local/*.sh builds an image from — internal/ciguard
      # fails if a build input stops triggering a kind workflow (B28.198).
      - 'cmd/**'
      - 'internal/**'
      - 'migrations/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile.control-plane'
      - 'osb/**'
      - 'auth-service/src/**'
      - 'auth-service/Cargo.*'
      - 'auth-service/Dockerfile'
      - 'Makefile'
      - '.github/workflows/kind-observability.yaml'
  # Pull requests run this through pr.yaml, which calls it when a file the push
  # paths above name changes, so its checks can be required (B33.2).
  workflow_call:
  workflow_dispatch:

concurrency:
  group: kind-observability-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kind-observability:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install kind, kubectl, helm (pinned + checksum-verified)
        env:
          KIND_VERSION: v0.31.0
          KIND_SHA256: eb244cbafcc157dff60cf68693c14c9a75c4e6e6fedaf9cd71c58117cb93e3fa
          KUBECTL_VERSION: v1.35.0
          KUBECTL_SHA256: a2e984a18a0c063279d692533031c1eff93a262afcc0afdc517375432d060989
          HELM_VERSION: v4.2.0
          HELM_SHA256: 97dbeb971be4ac4b27e3839976d9564c0fb35c6f3b1da89dd1e292d236af4096
        run: |
          set -euo pipefail
          curl -fsSL -o kind "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  kind" | sha256sum -c -
          sudo install -m 0755 kind /usr/local/bin/kind
          curl -fsSL -o kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  kubectl" | sha256sum -c -
          sudo install -m 0755 kubectl /usr/local/bin/kubectl
          curl -fsSL -o helm.tar.gz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm.tar.gz" | sha256sum -c -
          tar -xzf helm.tar.gz linux-amd64/helm
          sudo install -m 0755 linux-amd64/helm /usr/local/bin/helm
          kind version; kubectl version --client; helm version
      - name: make kind-observability
        # The cluster is kept for the screenshots below; it goes with the runner.
        env:
          KEEP_CLUSTER: "1"
        run: make kind-observability
      # What the drill measured, as Grafana draws it. Not a gate: the drill
      # above already passed or failed on the numbers.
      - name: Screenshot the Request Traffic dashboard at 1440 and 390 wide
        continue-on-error: true
        env:
          PLAYWRIGHT_VERSION: 1.63.0
        run: |
          set -euo pipefail
          ctx=kind-edge-observability
          GF_PASS="$(kubectl --context "$ctx" -n monitoring get secret edge-observability-grafana -o jsonpath='{.data.admin-password}' | base64 -d)"
          export GF_PASS
          kubectl --context "$ctx" -n monitoring port-forward svc/grafana 13000:3000 >/dev/null 2>&1 &
          mkdir -p "$RUNNER_TEMP/shots" && cd "$RUNNER_TEMP/shots"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "playwright@${PLAYWRIGHT_VERSION}" >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          cat > shots.cjs <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const auth = 'Basic ' + Buffer.from('admin:' + process.env.GF_PASS).toString('base64');
            const browser = await chromium.launch();
            for (const [w, h] of [[1440, 900], [390, 844]]) {
              const ctx = await browser.newContext({ viewport: { width: w, height: h }, extraHTTPHeaders: { Authorization: auth } });
              const page = await ctx.newPage();
              await page.goto('http://127.0.0.1:13000/d/edge-request-traffic?orgId=1&from=now-15m&to=now&kiosk', { waitUntil: 'networkidle' });
              await page.getByText('RPS by cluster').first().waitFor({ timeout: 30000 });
              await page.waitForTimeout(3000);
              // The viewport only: Grafana scrolls inside its own container, so a
              // full-page capture comes out blank.
              await page.screenshot({ path: `request-traffic-${w}.png` });
            }
            await browser.close();
          })().catch((e) => { console.error(e); process.exit(1); });
          JS
          node shots.cjs
          ls -l ./*.png
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        continue-on-error: true
        with:
          name: grafana-request-traffic
          path: ${{ runner.temp }}/shots/*.png
          if-no-files-found: ignore
