name: Kind Install Guide

# Runs `make kind-install-guide` — the customer install guide, docs/install.md,
# run as written on a throwaway kind cluster: every sh block in order, in one
# shell, against kind with Calico and the release's images built from the
# working tree. Then docs/upgrade.md, the same way, to a second release. Passes
# only if every block runs and every check in them holds; then the cluster is
# deleted (B28.239). The guide installs the ha profile (B28.240).
on:
  # Nightly on main too: the guide pulls cert-manager and the datastores' images
  # from the internet, so drift there shows up the next morning. internal/ciguard
  # fails if a workflow has no schedule (B28.199).
  schedule:
    - cron: '47 4 * * *'
  push:
    branches: [main]
    paths:
      - 'docs/install.md'
      - 'docs/upgrade.md'
      - 'deploy/helm/**'
      - 'deploy/profiles/**'
      - 'deploy/hack/release-pin.sh'
      - 'scripts/bootstrap-pki.sh'
      - 'deploy/local/install-guide.sh'
      - 'deploy/local/up.sh'
      - 'deploy/local/lib.sh'
      - 'deploy/local/kind-config.yaml'
      # Everything deploy/local/*.sh builds an image from — internal/ciguard
      # fails if a build input stops triggering a kind workflow (B28.198).
      - 'cmd/**'
      - 'internal/**'
      - 'migrations/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile.control-plane'
      - 'osb/**'
      - 'auth-service/src/**'
      - 'auth-service/Cargo.*'
      - 'auth-service/Dockerfile'
      - 'Makefile'
      - '.github/workflows/kind-install-guide.yaml'
  # Pull requests run this through pr.yaml, which calls it when a file the push
  # paths above name changes, so its checks can be required (B33.2).
  workflow_call:
  workflow_dispatch:

concurrency:
  group: kind-install-guide-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kind-install-guide:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install kind, kubectl, helm (pinned + checksum-verified)
        env:
          KIND_VERSION: v0.31.0
          KIND_SHA256: eb244cbafcc157dff60cf68693c14c9a75c4e6e6fedaf9cd71c58117cb93e3fa
          KUBECTL_VERSION: v1.35.0
          KUBECTL_SHA256: a2e984a18a0c063279d692533031c1eff93a262afcc0afdc517375432d060989
          HELM_VERSION: v4.2.0
          HELM_SHA256: 97dbeb971be4ac4b27e3839976d9564c0fb35c6f3b1da89dd1e292d236af4096
        run: |
          set -euo pipefail
          curl -fsSL -o kind "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  kind" | sha256sum -c -
          sudo install -m 0755 kind /usr/local/bin/kind
          curl -fsSL -o kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  kubectl" | sha256sum -c -
          sudo install -m 0755 kubectl /usr/local/bin/kubectl
          curl -fsSL -o helm.tar.gz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm.tar.gz" | sha256sum -c -
          tar -xzf helm.tar.gz linux-amd64/helm
          sudo install -m 0755 linux-amd64/helm /usr/local/bin/helm
          kind version; kubectl version --client; helm version
      - name: make kind-install-guide
        run: make kind-install-guide
