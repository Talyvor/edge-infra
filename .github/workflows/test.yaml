name: Test

# Runs the unit + integration test suites. The existing images.yaml only
# *builds* the binaries, so before this workflow nothing actually executed
# the auth-service integration tests or the control-plane Go tests on a PR.
on:
  # Nightly on main too: what drifts without a commit (a base image, a fetched
  # manifest, a registry tag) shows up the next morning. internal/ciguard
  # fails if a workflow has no schedule (B28.199).
  schedule:
    - cron: '17 3 * * *'
  push:
    paths:
      - 'auth-service/**'
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      # internal/ciguard reads these, so a change to them alone must run it.
      - '.github/workflows/**'
      - 'deploy/local/**'
      - 'Dockerfile.control-plane'
      - 'osb/Dockerfile'
  pull_request:
    branches: [main]
    paths:
      - 'auth-service/**'
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      # internal/ciguard reads these, so a change to them alone must run it.
      - '.github/workflows/**'
      - 'deploy/local/**'
      - 'Dockerfile.control-plane'
      - 'osb/Dockerfile'

jobs:
  auth-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            auth-service/target
          key: cargo-test-${{ hashFiles('auth-service/Cargo.lock') }}
          restore-keys: |
            cargo-test-
      - name: cargo test
        working-directory: auth-service
        run: cargo test --locked

  control-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: go test
        run: go test ./... -count=1
      # Two tests match -run TestXDS and they prove DIFFERENT things:
      #   TestXDSMutualTLSHandshake   — Go client vs Go server, pure in-memory certs.
      #   TestXDSRealEnvoyTLSVersion  — a REAL envoyproxy/envoy container against the
      #                                 real buildTLSCreds server. This is the only
      #                                 thing in the repo that proves Envoy and the
      #                                 control plane can actually complete a
      #                                 handshake, and it is F10's regression test.
      #
      # ⚠ THE REAL-ENVOY ONE SKIPS ITSELF WHEN DOCKER IS ABSENT, and `go test` prints
      # `ok` and EXITS 0 on a SKIP. So the Go-only sibling's PASS carried this step
      # either way: with docker unavailable the command still exited 0 while
      # `--- SKIP: TestXDSRealEnvoyTLSVersion` sat in the output. "Wired into CI" and
      # "actually executed" are different claims, and the gap between them is exactly
      # the shape F10 survived in for a whole work arc. Assert the stronger claim.
      #
      # ⚠ `set -o pipefail` is load-bearing. Without it `go test | tee` reports TEE's
      # status, so a genuine FAILURE exits 0 and only the SKIP check would speak. The
      # default GitHub shell is `bash -e {0}` — no pipefail — so it must be explicit.
      - name: xDS mTLS handshake + real-Envoy TLS pairing (integration-tagged)
        run: |
          set -euo pipefail
          go test -tags integration -v ./cmd/server/ -run TestXDS -count=1 2>&1 | tee /tmp/xds.log
          if grep -q -- '--- SKIP' /tmp/xds.log; then
            echo "::error::a TestXDS case SKIPPED — the real-Envoy handshake proof did not run"
            grep -- '--- SKIP' /tmp/xds.log
            exit 1
          fi

  # Supply-chain gate: govulncheck against the Go vulnerability DB, so a
  # reachable advisory in a dependency or the stdlib fails the build. It is
  # reachability-aware: a vuln in a required module the code never calls does
  # not fail. Go comes from go.mod, which matches the golang builder image in
  # Dockerfile.control-plane, so stdlib advisories are graded against the
  # runtime that ships. The tool is pinned (same version as talyvor-lens); the
  # DB is fetched fresh at scan time, and the nightly schedule above re-runs it
  # so a new advisory turns this red without a commit.
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          "$(go env GOPATH)/bin/govulncheck" ./...

  # Semgrep's managed default ruleset, pinned by version and digest as Track's,
  # Docs' and talyvor-code's CI are (B42.9). Fails on ERROR severity; every other
  # finding it reports is fixed or carries a nosemgrep reason in place.
  semgrep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: semgrep/semgrep:1.165.0@sha256:f4791a54c891eabe1188248135574e6e03dfc31dfd3f3b747c7bec7079bfed1b
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: semgrep scan --config p/default --metrics=off --severity ERROR --error --quiet

  # The same gate for auth-service (B28.261): cargo-audit checks Cargo.lock
  # against the RustSec advisory DB and fails on any vulnerability. The binary
  # is the upstream release, pinned by version and sha256; the DB is fetched
  # fresh at scan time, so the nightly schedule turns this red on a new
  # advisory. Each ignored advisory carries its reason in
  # auth-service/.cargo/audit.toml.
  rust-audit:
    runs-on: ubuntu-latest
    env:
      CARGO_AUDIT_VERSION: '0.22.2'
      CARGO_AUDIT_SHA256: ab28a1bdb54db4d5d8ad5981cf1f959410370b3d28250dbd35f6a44248620e39
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install cargo-audit (pinned release, checksum-verified)
        run: |
          name="cargo-audit-x86_64-unknown-linux-gnu-v${CARGO_AUDIT_VERSION}"
          curl -fsSL -o "$RUNNER_TEMP/$name.tgz" \
            "https://github.com/rustsec/rustsec/releases/download/cargo-audit%2Fv${CARGO_AUDIT_VERSION}/$name.tgz"
          echo "${CARGO_AUDIT_SHA256}  $RUNNER_TEMP/$name.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$name.tgz" -C "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/bin"
          install -m 0755 "$RUNNER_TEMP/$name/cargo-audit" "$RUNNER_TEMP/bin/cargo-audit"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # A scanner that cannot fail proves nothing, so first show it fails on a
      # lockfile with a published advisory: smallvec 1.6.0 (RUSTSEC-2021-0003).
      - name: cargo-audit fails on a known advisory
        run: |
          mkdir -p "$RUNNER_TEMP/known"
          printf '%s\n' 'version = 3' '' '[[package]]' 'name = "smallvec"' 'version = "1.6.0"' \
            'source = "registry+https://github.com/rust-lang/crates.io-index"' > "$RUNNER_TEMP/known/Cargo.lock"
          set +e
          cargo-audit audit --file "$RUNNER_TEMP/known/Cargo.lock" > "$RUNNER_TEMP/known.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/known.log"
          if [ "$rc" -eq 0 ] || ! grep -q 'RUSTSEC-2021-0003' "$RUNNER_TEMP/known.log"; then
            echo "::error::cargo-audit did not fail on smallvec 1.6.0 — this gate cannot go red"
            exit 1
          fi
      - name: cargo audit (auth-service/Cargo.lock)
        working-directory: auth-service
        run: cargo-audit audit
