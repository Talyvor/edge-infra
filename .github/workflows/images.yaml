name: Build and push images

on:
  # Nightly on main too: what drifts without a commit (a base image, a fetched
  # manifest, a registry tag) shows up the next morning. internal/ciguard
  # fails if a workflow has no schedule (B28.199).
  schedule:
    - cron: '17 3 * * *'
  # release.yaml builds through this workflow before it pins the charts.
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'Dockerfile.control-plane'
      - 'osb/**'
      - 'auth-service/src/**'
      - 'auth-service/Cargo.*'
      - 'auth-service/Dockerfile'
      - 'deploy/hack/release-version.sh'
      - 'deploy/hack/supply-chain.sh'
      - 'deploy/hack/image-scan.sh'
      - 'test/image-scan/**'
      - '.github/workflows/images.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'Dockerfile.control-plane'
      - 'osb/**'
      - 'auth-service/src/**'
      - 'auth-service/Cargo.*'
      - 'auth-service/Dockerfile'
      - 'deploy/hack/release-version.sh'
      - 'deploy/hack/supply-chain.sh'
      - 'deploy/hack/image-scan.sh'
      - 'test/image-scan/**'
      - '.github/workflows/images.yaml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Written out, in lowercase. Since 12 Oct 2026 this repository belongs to the GitHub organisation
  # whose login is "Talyvor" (capital T), and Docker refuses an image name with a capital letter, so
  # github.repository_owner can no longer be used for an image name. The signer identity is still
  # github.repository (Talyvor/edge-infra), exactly as the certificate spells it.
  OWNER: talyvor

jobs:
  # The version every image below is stamped with (deploy/hack/release-version.sh):
  # X.Y.Z on a vX.Y.Z tag, where each image is also pushed as :X.Y.Z next to
  # :<sha>, else 0.0.0-g<sha12>. The stamp is the OCI labels .version, .revision
  # and .source, which release.yaml checks on the pulled images.
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - id: v
        run: |
          set -euo pipefail
          bash deploy/hack/release-version.sh "$GITHUB_REF" "$GITHUB_SHA" | tee -a "$GITHUB_OUTPUT"

  control-plane:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # The digest each push produced, which the sign job signs — not the tag,
    # which a later push of the same commit can move.
    outputs:
      edge-control-plane: ${{ steps.edge-control-plane.outputs.digest }}
      edge-issuer: ${{ steps.edge-issuer.outputs.digest }}
      edge-ratelimit: ${{ steps.edge-ratelimit.outputs.digest }}
      edge-secrets: ${{ steps.edge-secrets.outputs.digest }}
      edge-migrate: ${{ steps.edge-migrate.outputs.digest }}
      edge-attest: ${{ steps.edge-attest.outputs.digest }}
    env:
      STAMP: |
        org.opencontainers.image.version=${{ needs.version.outputs.version }}
        org.opencontainers.image.revision=${{ github.sha }}
        org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: edge-control-plane
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.control-plane
          target: server
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ env.OWNER }}/edge-control-plane:${{ github.sha }}
            ${{ github.event_name != 'pull_request' && format('ghcr.io/{0}/edge-control-plane:latest', env.OWNER) || '' }}
            ${{ needs.version.outputs.release && format('ghcr.io/{0}/edge-control-plane:{1}', env.OWNER, needs.version.outputs.release) || '' }}
          labels: ${{ env.STAMP }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - id: edge-issuer
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.control-plane
          target: issuer
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ env.OWNER }}/edge-issuer:${{ github.sha }}
            ${{ github.event_name != 'pull_request' && format('ghcr.io/{0}/edge-issuer:latest', env.OWNER) || '' }}
            ${{ needs.version.outputs.release && format('ghcr.io/{0}/edge-issuer:{1}', env.OWNER, needs.version.outputs.release) || '' }}
          labels: ${{ env.STAMP }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - id: edge-ratelimit
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.control-plane
          target: ratelimit
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ env.OWNER }}/edge-ratelimit:${{ github.sha }}
            ${{ github.event_name != 'pull_request' && format('ghcr.io/{0}/edge-ratelimit:latest', env.OWNER) || '' }}
            ${{ needs.version.outputs.release && format('ghcr.io/{0}/edge-ratelimit:{1}', env.OWNER, needs.version.outputs.release) || '' }}
          labels: ${{ env.STAMP }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - id: edge-secrets
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.control-plane
          target: secrets
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ env.OWNER }}/edge-secrets:${{ github.sha }}
            ${{ github.event_name != 'pull_request' && format('ghcr.io/{0}/edge-secrets:latest', env.OWNER) || '' }}
            ${{ needs.version.outputs.release && format('ghcr.io/{0}/edge-secrets:{1}', env.OWNER, needs.version.outputs.release) || '' }}
          labels: ${{ env.STAMP }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - id: edge-migrate
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.control-plane
          target: migrate
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ env.OWNER }}/edge-migrate:${{ github.sha }}
            ${{ github.event_name != 'pull_request' && format('ghcr.io/{0}/edge-migrate:latest', env.OWNER) || '' }}
            ${{ needs.version.outputs.release && format('ghcr.io/{0}/edge-migrate:{1}', env.OWNER, needs.version.outputs.release) || '' }}
          labels: ${{ env.STAMP }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - id: edge-attest
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.control-plane
          target: attest
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ env.OWNER }}/edge-attest:${{ github.sha }}
            ${{ github.event_name != 'pull_request' && format('ghcr.io/{0}/edge-attest:latest', env.OWNER) || '' }}
            ${{ needs.version.outputs.release && format('ghcr.io/{0}/edge-attest:{1}', env.OWNER, needs.version.outputs.release) || '' }}
          labels: ${{ env.STAMP }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  osb:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      edge-osb: ${{ steps.edge-osb.outputs.digest }}
    env:
      STAMP: |
        org.opencontainers.image.version=${{ needs.version.outputs.version }}
        org.opencontainers.image.revision=${{ github.sha }}
        org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: edge-osb
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: osb/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ env.OWNER }}/edge-osb:${{ github.sha }}
            ${{ github.event_name != 'pull_request' && format('ghcr.io/{0}/edge-osb:latest', env.OWNER) || '' }}
            ${{ needs.version.outputs.release && format('ghcr.io/{0}/edge-osb:{1}', env.OWNER, needs.version.outputs.release) || '' }}
          labels: ${{ env.STAMP }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  auth-service:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      STAMP: |
        org.opencontainers.image.version=${{ needs.version.outputs.version }}
        org.opencontainers.image.revision=${{ github.sha }}
        org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: arm64
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install arm64 cross-compiler
        if: matrix.arch == 'arm64'
        run: |
          rustup target add aarch64-unknown-linux-gnu
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Cache cargo registry + target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            auth-service/target
          key: cargo-${{ matrix.arch }}-${{ hashFiles('auth-service/Cargo.lock') }}
          restore-keys: |
            cargo-${{ matrix.arch }}-

      - name: Build amd64 (native)
        if: matrix.arch == 'amd64'
        working-directory: auth-service
        run: |
          cargo build --release
          mkdir -p dist
          cp target/release/auth-service dist/auth-service

      - name: Build arm64 (cross-compile)
        if: matrix.arch == 'arm64'
        working-directory: auth-service
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
        run: |
          cargo build --release --target aarch64-unknown-linux-gnu
          mkdir -p dist
          cp target/aarch64-unknown-linux-gnu/release/auth-service dist/auth-service

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        if: matrix.arch == 'amd64'
        with:
          context: auth-service
          file: auth-service/Dockerfile
          push: true
          platforms: ${{ matrix.platform }}
          tags: ghcr.io/${{ env.OWNER }}/auth-service:${{ github.sha }}-${{ matrix.arch }}
          labels: ${{ env.STAMP }}
          cache-from: type=gha,scope=auth-service-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=auth-service-${{ matrix.arch }}

      # arm64: skip Docker's Rust build entirely. The binary was cross-compiled
      # on the amd64 host above; this step just packages it into distroless via
      # BUILD_MODE=ci, then pushes with the linux/arm64 platform manifest. No
      # RUN commands execute, so no QEMU emulation is triggered.
      - name: Build and push arm64 (cross-compiled, no emulation)
        if: matrix.arch == 'arm64'
        run: |
          stamp=()
          while IFS= read -r l; do if [ -n "$l" ]; then stamp+=(--label "$l"); fi; done <<<"$STAMP"
          docker buildx build \
            --platform linux/arm64 \
            --build-arg BUILD_MODE=ci \
            "${stamp[@]}" \
            -f auth-service/Dockerfile \
            -t ghcr.io/${{ env.OWNER }}/auth-service:${{ github.sha }}-arm64 \
            --push \
            auth-service/

  auth-service-merge:
    needs: [version, auth-service]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      auth-service: ${{ steps.merge.outputs.digest }}
    steps:
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-arch manifest
        id: merge
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag ghcr.io/${{ env.OWNER }}/auth-service:${{ github.sha }} \
            ${{ github.event_name != 'pull_request' && format('--tag ghcr.io/{0}/auth-service:latest', env.OWNER) || '' }} \
            ${{ needs.version.outputs.release && format('--tag ghcr.io/{0}/auth-service:{1}', env.OWNER, needs.version.outputs.release) || '' }} \
            ghcr.io/${{ env.OWNER }}/auth-service:${{ github.sha }}-amd64 \
            ghcr.io/${{ env.OWNER }}/auth-service:${{ github.sha }}-arm64
          digest="$(docker buildx imagetools inspect ghcr.io/${{ env.OWNER }}/auth-service:${{ github.sha }} --format '{{json .Manifest}}' | jq -r .digest)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "no digest for auth-service:${{ github.sha }}: '$digest'"; exit 1; }
          echo "digest=$digest" >>"$GITHUB_OUTPUT"

  # Every image above is trivy-scanned before the sign job will sign any of them
  # (deploy/hack/image-scan.sh): a HIGH or CRITICAL vulnerability that already
  # has a fixed version fails the run, so a vulnerable image is never signed, and
  # the nightly run catches a CVE published after an image was built.
  scan:
    needs: [control-plane, osb, auth-service-merge]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      O: ghcr.io/${{ env.OWNER }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install trivy (pinned + checksum-verified)
        run: |
          bash deploy/hack/image-scan.sh install "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      # Two of the eight packages are private; the job token reads them.
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Every base image is pinned to a digest, and a floating one is refused
        run: |
          set -uo pipefail
          bash deploy/hack/image-scan.sh bases || exit 1
          if bash deploy/hack/image-scan.sh bases <(printf 'FROM python:3.12-slim\n'); then
            echo "bases passed a FROM pinned to a tag alone"
            exit 1
          fi
          echo "bases refused the floating FROM"
      - name: trivy, every image
        run: |
          bash deploy/hack/image-scan.sh scan \
            "$O/edge-control-plane@${{ needs.control-plane.outputs.edge-control-plane }}" \
            "$O/edge-issuer@${{ needs.control-plane.outputs.edge-issuer }}" \
            "$O/edge-ratelimit@${{ needs.control-plane.outputs.edge-ratelimit }}" \
            "$O/edge-secrets@${{ needs.control-plane.outputs.edge-secrets }}" \
            "$O/edge-migrate@${{ needs.control-plane.outputs.edge-migrate }}" \
            "$O/edge-attest@${{ needs.control-plane.outputs.edge-attest }}" \
            "$O/edge-osb@${{ needs.osb.outputs.edge-osb }}" \
            "$O/auth-service@${{ needs.auth-service-merge.outputs.auth-service }}"
      # The gate is worth something only if it can fail: the OSB image this run
      # pushed, with a known-vulnerable package planted in it, must be refused —
      # and refused for that CVE, not because the scanner could not run.
      - name: A planted CVE is refused
        run: |
          set -uo pipefail
          docker build -q --build-arg BASE="$O/edge-osb@${{ needs.osb.outputs.edge-osb }}" \
            -t edge-osb:planted test/image-scan/planted || exit 1
          rc=0
          out="$(bash deploy/hack/image-scan.sh scan edge-osb:planted 2>&1)" || rc=$?
          echo "$out"
          if [ "$rc" = 0 ]; then
            echo "the scan passed an image carrying CVE-2020-14343"
            exit 1
          fi
          if ! grep -q 'CVE-2020-14343' <<<"$out"; then
            echo "the scan failed, but not on the planted CVE-2020-14343"
            exit 1
          fi
          echo "the scan refused the planted CVE-2020-14343"

  # Every image above gets a cosign signature, an SPDX SBOM made by syft and SLSA
  # v1 provenance, attested to the digest its build pushed
  # (deploy/hack/supply-chain.sh, docs/self-host-supply-chain.md). Keyless: cosign
  # trades this job's OIDC token for a short-lived certificate naming
  # images.yaml@<ref>, and the signature goes to the public Rekor log. Only this
  # job holds id-token: write — the build jobs, which run the build's own code,
  # cannot mint a signing identity.
  sign:
    needs: [control-plane, osb, auth-service-merge, scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        image: [edge-control-plane, edge-issuer, edge-ratelimit, edge-secrets, edge-migrate, edge-attest, edge-osb, auth-service]
    env:
      DIGEST: ${{ needs.control-plane.outputs[matrix.image] || needs.osb.outputs[matrix.image] || needs.auth-service-merge.outputs[matrix.image] }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install cosign and syft (pinned + checksum-verified)
        run: |
          bash deploy/hack/supply-chain.sh install "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Sign ${{ matrix.image }}, attest its SBOM and provenance
        run: bash deploy/hack/supply-chain.sh sign "ghcr.io/$OWNER/${{ matrix.image }}@$DIGEST"

  # What a customer runs before installing: every image's signature, SBOM and
  # provenance verified against this run's own signer identity and commit, with
  # no write access and no OIDC token.
  verify:
    needs: [control-plane, osb, auth-service-merge, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install cosign and syft (pinned + checksum-verified)
        run: |
          bash deploy/hack/supply-chain.sh install "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      # Two of the eight packages are private; the job token reads them.
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: cosign verify and verify-attestation, every image
        env:
          SIGNER_REPO: ${{ github.repository }}
          SIGNER_REF: ${{ github.ref }}
          SIGNER_SHA: ${{ github.sha }}
          O: ghcr.io/${{ env.OWNER }}
        run: |
          bash deploy/hack/supply-chain.sh verify \
            "$O/edge-control-plane@${{ needs.control-plane.outputs.edge-control-plane }}" \
            "$O/edge-issuer@${{ needs.control-plane.outputs.edge-issuer }}" \
            "$O/edge-ratelimit@${{ needs.control-plane.outputs.edge-ratelimit }}" \
            "$O/edge-secrets@${{ needs.control-plane.outputs.edge-secrets }}" \
            "$O/edge-migrate@${{ needs.control-plane.outputs.edge-migrate }}" \
            "$O/edge-attest@${{ needs.control-plane.outputs.edge-attest }}" \
            "$O/edge-osb@${{ needs.osb.outputs.edge-osb }}" \
            "$O/auth-service@${{ needs.auth-service-merge.outputs.auth-service }}"
      # The per-arch auth-service image is an intermediate the merge consumes and
      # nothing signs, so verifying it must fail.
      - name: An unsigned image is refused
        env:
          SIGNER_REPO: ${{ github.repository }}
          SIGNER_REF: ${{ github.ref }}
        run: |
          set -uo pipefail
          if bash deploy/hack/supply-chain.sh verify "ghcr.io/$OWNER/auth-service:${{ github.sha }}-amd64"; then
            echo "verify passed an image nothing signed"
            exit 1
          fi
          echo "verify refused the unsigned image"
