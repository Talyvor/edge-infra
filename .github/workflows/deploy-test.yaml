name: Deploy Test

# Lints every Helm chart, validates everything the charts render with kubeconform
# (B28.236), and proves the edge-proxy xDS mTLS invariant (SNI + SAN peer
# pinning) renders for base and every profile in deploy/profiles — offline, no cluster. Closes the gap where deploy/** changes ran no CI, so a revert of
# xds.tls.enabled back to plaintext would otherwise pass CI silently.
on:
  # Nightly on main too: what drifts without a commit (a base image, a fetched
  # manifest, a registry tag) shows up the next morning. internal/ciguard
  # fails if a workflow has no schedule (B28.199).
  schedule:
    - cron: '17 3 * * *'
  push:
    paths:
      - 'deploy/**'
      - 'Makefile'
      - '.github/workflows/deploy-test.yaml'
  # Pull requests run this through pr.yaml, which calls it when a file the push
  # paths above name changes, so its checks can be required (B33.2).
  workflow_call:

jobs:
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install Helm
        run: |
          set -euo pipefail
          VERSION=v4.2.0
          echo "Installing Helm ${VERSION}"
          curl -fsSL -o helm.tar.gz \
            "https://get.helm.sh/helm-${VERSION}-linux-amd64.tar.gz"
          tar -xzf helm.tar.gz linux-amd64/helm
          sudo install -m 0755 linux-amd64/helm /usr/local/bin/helm
          helm version
      - name: Lint all charts
        run: |
          set -euo pipefail
          for chart in deploy/helm/*/; do
            helm lint --strict "$chart"
          done
      - name: Install kubeconform (pinned + checksum-verified)
        env:
          KUBECONFORM_VERSION: v0.7.0
          KUBECONFORM_SHA256: c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3
        run: |
          set -euo pipefail
          curl -fsSL -o kubeconform.tar.gz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum -c -
          tar -xzf kubeconform.tar.gz kubeconform
          sudo install -m 0755 kubeconform /usr/local/bin/kubeconform
          kubeconform -v
      - name: Every chart renders valid Kubernetes (kubeconform -strict)
        run: make kubeconform
      - name: The kubeconform check can fail
        run: |
          set -uo pipefail
          if CHARTS=edge-ratelimit bash deploy/hack/kubeconform.sh --set podAnnotations.broken=1 >/dev/null; then
            echo "kubeconform passed a Deployment with a numeric annotation"
            exit 1
          fi
          echo "kubeconform refused a Deployment with a numeric annotation"
      - name: Verify xDS mTLS invariant
        run: make verify-xds-mtls
      - name: No image on a floating tag
        run: make verify-image-pins
      - name: The image-pin check can fail
        run: |
          set -uo pipefail
          if bash deploy/hack/verify-image-pins.sh --set image.tag=latest >/dev/null; then
            echo "verify-image-pins passed a chart forced onto :latest"
            exit 1
          fi
          echo "verify-image-pins refused :latest"
      - name: Every image from the override registry
        run: make verify-image-registry
      - name: The registry check can fail
        run: |
          set -uo pipefail
          if IMAGE_REGISTRY=registry.internal:5000 bash deploy/hack/verify-image-pins.sh --set global.imageRegistry= >/dev/null; then
            echo "verify-image-registry passed charts rendered without the override"
            exit 1
          fi
          echo "verify-image-registry refused images not from the override registry"
      - name: The airgap profile check can fail
        run: |
          set -uo pipefail
          if bash deploy/hack/verify-image-pins.sh --set global.imageRegistry= >/dev/null; then
            echo "verify-image-pins passed the airgap profile rendered without its registry"
            exit 1
          fi
          echo "verify-image-pins refused the airgap profile pulling from outside its registry"
      - name: A release tag is the packaged chart version
        run: make release-version-test
      - name: Install promtool (pinned + checksum-verified)
        env:
          PROM_VERSION: 3.5.0
          PROM_SHA256: e811827af26d822afb09a4f28314f61b618b12cff5369835a67f674d8b46f39a
        run: |
          set -euo pipefail
          curl -fsSL -o prometheus.tar.gz "https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/prometheus-${PROM_VERSION}.linux-amd64.tar.gz"
          echo "${PROM_SHA256}  prometheus.tar.gz" | sha256sum -c -
          tar -xzf prometheus.tar.gz "prometheus-${PROM_VERSION}.linux-amd64/promtool"
          sudo install -m 0755 "prometheus-${PROM_VERSION}.linux-amd64/promtool" /usr/local/bin/promtool
          promtool --version
      - name: The edge-observability alert and recording rules pass promtool
        run: make observability-rules
