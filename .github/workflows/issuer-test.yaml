name: Issuer Test

# Runs the token-issuer test suite against a real Postgres. The DB-backed
# store tests skip when ISSUER_TEST_DATABASE_URL is unset, so this is the job
# that actually exercises them.
on:
  # Nightly on main too: what drifts without a commit (a base image, a fetched
  # manifest, a registry tag) shows up the next morning. internal/ciguard
  # fails if a workflow has no schedule (B28.199).
  schedule:
    - cron: '17 3 * * *'
  push:
    paths:
      - 'internal/issuer/**'
      - 'cmd/issuer/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/issuer-test.yaml'
  # Pull requests run this through pr.yaml, which calls it when a file the push
  # paths above name changes, so its checks can be required (B33.2).
  workflow_call:

jobs:
  issuer:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: issuer
          POSTGRES_PASSWORD: issuer
          POSTGRES_DB: issuer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U issuer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ISSUER_TEST_DATABASE_URL: postgres://issuer:issuer@localhost:5432/issuer?sslmode=disable
      ISSUER_DATABASE_URL: postgres://issuer:issuer@localhost:5432/issuer?sslmode=disable
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply migrations
        run: go run ./cmd/issuer migrate
      - name: go test
        run: go test ./internal/issuer/... ./cmd/issuer/... -count=1
