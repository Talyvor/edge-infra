name: Release

# The release: build and push every image at one commit, pin every chart image to
# that build, prove the pinned charts on a throwaway kind cluster with every
# first-party image PULLED from the registry — nothing built from the working
# tree — and publish the pinned charts as this run's artifact.
#
# A git tag v<SemVer> is a release: `git tag v1.2.3 && git push origin v1.2.3`.
# Its images are pushed at :<sha> AND :1.2.3, the charts pin :1.2.3 and package
# as version 1.2.3, and the packages are attached to the GitHub release v1.2.3.
# Every other run (nightly, main, PR) is the dev version 0.0.0-g<sha12> pinned to
# :<sha>. deploy/hack/release-version.sh maps the ref to the version.
#   images       — images.yaml, called: all eight images pushed and stamped, then
#                  signed with an SBOM and SLSA provenance, and verified
#   release-e2e  — release-pin.sh <tag>, the stamps checked, make release-e2e,
#                  helm package --version -> checked -> artifact edge-charts-<version>
#   publish      — on a tag only: the GitHub release with the packaged charts
#
# Unlike the kind-* workflows it is not filtered on the image-build inputs
# (internal/ciguard): it builds nothing itself, and runs on main every night.
# The committed values.yaml pins are left alone — kind-cutover rehearses from them.
on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    # Path filters do not apply to tags: every v* tag is released.
    tags: ['v*']
    paths:
      - '.github/workflows/release.yaml'
      - 'deploy/hack/release-pin.sh'
      - 'deploy/hack/release-version.sh'
  # Pull requests run this through pr.yaml, which calls it when a file the push
  # paths above name changes, so its checks can be required (B33.2).
  workflow_call:

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    uses: ./.github/workflows/images.yaml
    permissions:
      contents: read
      packages: write
      # images.yaml's sign job signs keylessly with the job's OIDC token.
      id-token: write

  release-e2e:
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Version from the ref
        id: v
        run: |
          set -euo pipefail
          bash deploy/hack/release-version.sh "$GITHUB_REF" "$GITHUB_SHA" | tee -a "$GITHUB_OUTPUT"
      - name: Install kind, kubectl, helm (pinned + checksum-verified)
        env:
          KIND_VERSION: v0.31.0
          KIND_SHA256: eb244cbafcc157dff60cf68693c14c9a75c4e6e6fedaf9cd71c58117cb93e3fa
          KUBECTL_VERSION: v1.35.0
          KUBECTL_SHA256: a2e984a18a0c063279d692533031c1eff93a262afcc0afdc517375432d060989
          HELM_VERSION: v4.2.0
          HELM_SHA256: 97dbeb971be4ac4b27e3839976d9564c0fb35c6f3b1da89dd1e292d236af4096
        run: |
          set -euo pipefail
          curl -fsSL -o kind "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  kind" | sha256sum -c -
          sudo install -m 0755 kind /usr/local/bin/kind
          curl -fsSL -o kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  kubectl" | sha256sum -c -
          sudo install -m 0755 kubectl /usr/local/bin/kubectl
          curl -fsSL -o helm.tar.gz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm.tar.gz" | sha256sum -c -
          tar -xzf helm.tar.gz linux-amd64/helm
          sudo install -m 0755 linux-amd64/helm /usr/local/bin/helm
          kind version; kubectl version --client; helm version
      # Two of the eight packages are private; the job token reads them.
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pin every chart image to ${{ steps.v.outputs.image_tag }}
        env:
          IMAGE_TAG: ${{ steps.v.outputs.image_tag }}
        run: |
          set -euo pipefail
          bash deploy/hack/release-pin.sh "$IMAGE_TAG"
          bash deploy/hack/release-pin.sh --list
          make verify-image-pins
      - name: Every pinned image is stamped ${{ steps.v.outputs.version }}
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: bash deploy/hack/release-version.sh --stamps "$VERSION" "$GITHUB_SHA"
      - name: make release-e2e
        run: make release-e2e
      - name: Package the pinned charts as ${{ steps.v.outputs.version }}
        env:
          VERSION: ${{ steps.v.outputs.version }}
          IMAGE_TAG: ${{ steps.v.outputs.image_tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for c in deploy/helm/*/; do helm package "$c" -d dist --version "$VERSION" --app-version "$IMAGE_TAG"; done
          ls -l dist
          bash deploy/hack/release-version.sh --check "$VERSION" "$IMAGE_TAG" dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: edge-charts-${{ steps.v.outputs.version }}
          path: dist/*.tgz
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-e2e
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: edge-charts-${{ needs.release-e2e.outputs.version }}
          path: dist
      - name: GitHub release ${{ github.ref_name }} with the charts
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release-e2e.outputs.version }}
        run: |
          set -euo pipefail
          pre=(); case "$VERSION" in *-*) pre=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/*.tgz --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "Talyvor Edge $GITHUB_REF_NAME" --generate-notes "${pre[@]}"
