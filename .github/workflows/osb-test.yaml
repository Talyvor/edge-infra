name: OSB Test

# Runs the OSB broker's Python suite. Before this, no workflow ran osb/** tests
# — only images.yaml built the image, so the R4 translator's unit correctness
# re-ran on no push. Two jobs:
#   pytest       — fast, DB-free gate (mock suite); the always-green gate.
#   integration  — the DB-backed integration E2E suite against a real Postgres:
#                  the cross-language OSB -> data-plane E2E (Python translator
#                  writes; Go LoadSnapshot serves) AND the edge-secrets custodian
#                  E2E (operator mTLS write -> secrets row -> per-SNI render).
#
# GitHub path filters are workflow-level, so both jobs share the union of paths;
# the fast pytest gate harmlessly also runs on internal/store|secrets/** changes
# (the mock suite is DB-free and unaffected).
on:
  # Nightly on main too: what drifts without a commit (a base image, a fetched
  # manifest, a registry tag) shows up the next morning. internal/ciguard
  # fails if a workflow has no schedule (B28.199).
  schedule:
    - cron: '17 3 * * *'
  push:
    paths:
      - 'osb/**'
      - 'internal/store/**'
      - 'internal/secrets/**'
      - 'cmd/secrets/**'
      - 'cmd/server/**'
      - 'internal/migrate/**'
      - 'migrations/**'
      - '.github/workflows/osb-test.yaml'
  # Pull requests run this through pr.yaml, which calls it when a file the push
  # paths above name changes, so its checks can be required (B33.2).
  workflow_call:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install OSB + dev deps (hash-locked)
        run: |
          pip install --require-hashes -r osb/requirements-dev.lock
          pip install --no-deps -e ./osb
      - name: pytest (mock-only; integration tests skip without TEST_DATABASE_URL)
        run: pytest -q
        working-directory: osb

  # Supply-chain gate (B28.261): pip-audit checks requirements.lock (what the
  # image installs) and requirements-dev.lock (what CI installs) against the
  # PyPI advisory data and fails on any known vulnerability. --disable-pip
  # audits the hash-locked pins as written rather than re-resolving them, and
  # --strict fails if a pin cannot be audited at all. The scanner is itself
  # hash-locked; the advisory data is fetched at scan time, so the nightly
  # schedule above turns this red when a new advisory lands.
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Install pip-audit (hash-locked)
        run: pip install --require-hashes -r osb/requirements-audit.lock
      # A scanner that cannot fail proves nothing, so first show it fails on a
      # pin with a published advisory: requests 2.19.1 (PYSEC-2018-28).
      - name: pip-audit fails on a known advisory
        run: |
          printf 'requests==2.19.1\n' > "$RUNNER_TEMP/known-advisory.pins"
          set +e
          pip-audit --disable-pip --no-deps --progress-spinner off \
            -r "$RUNNER_TEMP/known-advisory.pins" > "$RUNNER_TEMP/known.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/known.log"
          if [ "$rc" -eq 0 ] || ! grep -q 'PYSEC-2018-28' "$RUNNER_TEMP/known.log"; then
            echo "::error::pip-audit did not fail on requests 2.19.1 — this gate cannot go red"
            exit 1
          fi
      - name: pip-audit (osb/requirements.lock + osb/requirements-dev.lock)
        run: make -f osb/Makefile audit

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: osb
          POSTGRES_PASSWORD: osb
          POSTGRES_DB: edge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U osb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://osb:osb@localhost:5432/edge?sslmode=disable
      # Absolute path: the Go E2E runs `go test ./internal/store/`, whose test
      # binary executes with cwd=the package dir, so a relative provision.py path
      # would resolve under internal/store/. github.workspace is the repo root.
      OSB_PROVISION: python ${{ github.workspace }}/osb/tools/provision.py
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install OSB + dev deps (hash-locked)
        run: |
          pip install --require-hashes -r osb/requirements-dev.lock
          pip install --no-deps -e ./osb
      - name: Apply both schemas to the one shared database
        run: |
          python - <<'PY'
          import asyncio, os, asyncpg
          FILES = [
              "migrations/0001_init.sql",
              "migrations/0002_controller_fields.sql",
              "migrations/0003_service_policy.sql",
              "migrations/0004_auth_policy.sql",
              "migrations/0005_route_tls_secret.sql",
              "migrations/0006_secret_kind.sql",
              "migrations/0007_route_client_ca.sql",
              "migrations/0009_egress_destinations.sql",
              "migrations/0010_egress_keyless.sql",
              "migrations/0011_edge_decisions.sql",
              "osb/migrations/0001_osb.sql",
              "osb/migrations/0002_tenancy.sql",
              "osb/migrations/0003_dead_letter.sql",
              "osb/migrations/0004_freeze.sql",
          ]
          async def main():
              conn = await asyncpg.connect(os.environ["TEST_DATABASE_URL"])
              try:
                  for f in FILES:
                      with open(f) as fh:
                          await conn.execute(fh.read())
              finally:
                  await conn.close()
          asyncio.run(main())
          PY
      - name: Python translator + tenancy suites (shared DB)
        run: pytest tests/test_translator.py tests/test_tenancy.py -q
        working-directory: osb
      # The provisioning freeze (B28.197) is a worker + JetStream behaviour, so its
      # E2E needs a real JetStream next to the real Postgres. Services cannot pass
      # `-js`, hence a plain container. The test skips without TEST_NATS_URL, and a
      # skip is not a pass: any SKIPPED line fails the step.
      - name: Start NATS JetStream
        run: |
          docker run -d --name nats -p 4222:4222 nats:2.10-alpine -js
          for _ in $(seq 1 30); do (echo > /dev/tcp/127.0.0.1/4222) 2>/dev/null && exit 0; sleep 1; done
          docker logs nats; exit 1
      - name: OSB freeze E2E — real Postgres + JetStream (no SKIP allowed)
        env:
          TEST_NATS_URL: nats://127.0.0.1:4222
        working-directory: osb
        run: |
          set -euo pipefail
          pytest tests/test_freeze.py -q -rs 2>&1 | tee /tmp/freeze.log
          if grep -q SKIPPED /tmp/freeze.log; then
            echo "::error::freeze E2E SKIPPED — it did not actually execute"
            exit 1
          fi
      - name: Go cross-language E2E (-count=1, no cached pass)
        run: go test -count=1 -tags integration ./internal/store/ -run TestLoadSnapshot_OSB
      - name: Go edge-secrets custodian E2E (-count=1, no cached pass)
        run: go test -count=1 -tags integration ./internal/secrets/ -run TestE2E
      # Admin READ API: key-free store readers + the five-endpoint leak-guard
      # E2E (no response may carry key material; readers need no KEK).
      - name: Go admin read-API store readers (-count=1, no cached pass)
        run: go test -count=1 -tags integration ./internal/store/ -run TestAdminRead
      - name: Go admin read-API E2E leak guard (-count=1, no cached pass)
        run: go test -count=1 -tags integration ./cmd/server/ -run TestAdminAPI
      # B28.228: edge-egress's decision log appends and exports as one chain.
      - name: Go decision log chain (-count=1, no cached pass)
        run: go test -count=1 -v -tags integration ./internal/store/ -run TestDecisions
      # Schema-safety + co-location suites. BOTH reset `public` on the database
      # they are given (DROP SCHEMA public CASCADE), so each gets its OWN
      # throwaway database — never `edge`, which the steps above depend on.
      #
      # Until now neither ran anywhere: no workflow named ./internal/migrate/,
      # and internal/store was only ever entered with -run TestLoadSnapshot_OSB
      # / TestAdminRead, neither of which matches TestVerifyColocation. That
      # invariant is what cmd/server/admin.go cites as the reason the Admin API
      # may share this process — a justification resting on a test that had
      # never executed. internal/ciguard now fails the build if this recurs.
      - name: Create throwaway databases for the schema suites
        run: |
          python - <<'PY'
          import asyncio, os, asyncpg
          async def main():
              conn = await asyncpg.connect(os.environ["TEST_DATABASE_URL"])
              try:
                  for db in ("migrate_test", "colocation_test"):
                      await conn.execute(f'DROP DATABASE IF EXISTS {db}')
                      await conn.execute(f'CREATE DATABASE {db}')
              finally:
                  await conn.close()
          asyncio.run(main())
          PY
      # `go test` exits 0 on a SKIP, and both suites skip themselves when their
      # DSN is unset — so "wired into CI" and "actually executed" are different
      # claims. Assert the stronger one: any SKIP here fails the step.
      - name: Go migration-safety suite (-count=1, no cached pass)
        env:
          MIGRATE_TEST_DSN: postgres://osb:osb@localhost:5432/migrate_test?sslmode=disable
        run: |
          set -euo pipefail
          go test -count=1 -v -tags integration ./internal/migrate/ -run 'TestApply|TestBaseline' 2>&1 | tee /tmp/migrate-suite.log
          if grep -q -- '--- SKIP' /tmp/migrate-suite.log; then
            echo "::error::suite SKIPPED — it did not actually execute"
            grep -- '--- SKIP' /tmp/migrate-suite.log
            exit 1
          fi
      - name: Go co-location invariant (-count=1, no cached pass)
        env:
          COLOCATION_TEST_DSN: postgres://osb:osb@localhost:5432/colocation_test?sslmode=disable
        run: |
          set -euo pipefail
          go test -count=1 -v -tags integration ./internal/store/ -run TestVerifyColocation 2>&1 | tee /tmp/colocation.log
          if grep -q -- '--- SKIP' /tmp/colocation.log; then
            echo "::error::suite SKIPPED — it did not actually execute"
            grep -- '--- SKIP' /tmp/colocation.log
            exit 1
          fi
